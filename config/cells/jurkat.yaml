      preplaced_off: "{data_root}/data/derived/wc/prepass_off.npy"
      preplaced_libs: "{data_root}/data/derived/wc/prepass_libs.json"
      mrna_pts: "{data_root}/data/derived/wc/mrna_pts.npy"
      mrna_off: "{data_root}/data/derived/wc/mrna_off.npy"
      mrna_meta: "{data_root}/data/derived/wc/mrna_meta.json"
