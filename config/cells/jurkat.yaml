  compare_reference:                 # the archived legacy v7 pack (read-only) and the ported validation run on it
    name: v7
    legacy_pipeline_dir: "{data_root}/jurkat/yc/pipeline"
    validate_dir: "{results_root}/jurkat/_v7_reference/validate"
