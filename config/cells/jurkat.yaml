      measured: nc_hpa               # log2(mean nucleus interior / mean cytoplasm interior), HPA JURKAT cells
      model: nc_model                # same measure on the rendered model images (expected mode)
      split: split                   # fit / holdout (frozen halves of the HPA JURKAT genes)
      splits: [holdout, all]
      test: holdout
      legacy_json: "{data_root}/data/derived/validation/tier2_v7.json"
      legacy_keys: {all: sets/all/expected/nc/spearman}
      legacy_note: "tier2_v7.json rounds to 3 decimals"
      note: "model: rendered model images (Tier-2 'expected' mode) of the v7 pack; image: HPA JURKAT ICC"
    copies_reference_na: >-
      no second Jurkat absolute proteome on disk: the inventory uses Geiger 2012 (PaxDb Jurkat sets derive from it);
      Rieckmann 2017 (primary immune cells) and Kim 2014 (adult CD4/CD8 T cells) are other cell types (not wired)
    proximity_na: >-
      no BioPlex / OpenCell interactome on disk (BioGRID 5.0.263 human, IntAct and STRING v12 are) and no Jurkat
      neighbour-enrichment code: the common contact counting comes with BD v2 (plan s6.1)
    extras_na:
      - {metric: jurkat.fluorescence_panels, kind: not ported, reason: "fluor.py panels (V8) not ported to the core"}
      - {metric: jurkat.galleries, kind: not ported, reason: "image galleries (V8) not ported to the core"}
      - {metric: jurkat.image_compartment_shares_v8, kind: phase 3, reason: "v8 imaging 1 - TVD (C4) not wired"}
    reference:                       # no-regression reference build (plan s5) and its suite output
      # Step 3 freeze (docs/unification_criteria/freeze_v8.md §1, §7): the accepted combined Step-2 build (verdict
      # validate/compare_step2_v3, ACCEPTED with the 2026-11-19 recorded deviations). Was the v7 reproduction
      # jurkat/20261115-ec0b403-s20261115-v7repro2 (suite _dev_unify/a8p2/.../suite.json; config/cells/jurkat_v7_port.yaml).
      build: "{results_root}/jurkat/20261118-40d7967-s20261115-step2"
      suite: "{results_root}/jurkat/20261118-40d7967-s20261115-step2/validate/suite.json"

# --- export (owner: validate/export) ---
export:
  cell_type: "T lymphocyte (leukaemia line E6-1)"
  state: "resting, cell 1 of jrc_jurkat-1"
  status: preview
  data_base: "./"                    # relative to the registry; the deploy script sets the hosted URL ({cell_id}/{build_id} allowed)
  licence: {data: CC-BY-4.0}
  default_bookmark: Whole cell
  tiles: {enabled: true, tile_nm: 200, block_tiles: 5, q_org_nm: 80, q_range_nm: 360, shard_max_mb: 45}   # YCT2 viewer tiles (export step tiles_v2 via `all`); ON for the paper build: DECISION Pedro 2026-11-19
  preplaced_groups:                  # pre-pass libraries -> viewer region groups (ids after pack.regions)
    chromatin: [NUCLEOSOME, "H1-*", CPX-2387, CTCF, CPX-5989, CPX-5991]
    polysomes: [RIBO80S]
    cytoskeleton: [MT_*, F_ACTB]
    npc: [NPC]
    lamina: [LMNB1, LMNB2, LMNA]
    atp_synthase: [CPX-6151]         # B4: ATP synthase dimer rows on the cristae rims
  regions:                           # display data (legacy jenc.region_map: virtual regions shown as cytosol, NPC channel as NPC)
    mt_lattice: {display_as: cytosol}
    mt_plus: {display_as: cytosol}
    pcm: {display_as: cytosol}
    vim_cage: {display_as: cytosol}
    sh_NPC_fg: {display_as: sh_NPC}
  sim_defaults: {temperature_K: 310.15, viscosity_Pa_s: 6.9e-4, ionic_strength_M: 0.15}

