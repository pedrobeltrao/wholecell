# Jurkat E6-1 T cell, cell 1 of OpenOrganelle jrc_jurkat-1 = port of the published pack v7.
# Schema: docs/reference/cell_config.md. Sections are owned by stage maintainers; keep keys inside your section.
schema_version: 1
cell_id: jurkat
name: Jurkat E6-1 T cell (jrc_jurkat-1 cell 1)
organism: {name: Homo sapiens, taxon: 9606}
aliases: {v7: "legacy pack v7 (2026-11-11)"}
plugins: [jurkat]

seeds:
  master: 20261115
  legacy:              # exact reproduction of the published v7 seeds (remove this block for a master-seed build)
    pack.counts: 3
    pack.tile: "k*7919+11"
    prepass.lamina: 20261112

build:
  allow_dirty: false

# --- geometry (owner: geometry/toolkits) ---
geometry:
  # em_cell1_v8 (B6, 2026-11-17) = em_cell1_v7 with ne_mid recomputed as a true signed distance on both sides
  # (toolkits/em/jne_fix.py; perinuclear 2.74 -> ~8.1 um3; criteria docs/unification_criteria/B6_geometry.md).
  # The v7 package (toolkits/em/convert_legacy.py, B1 exact) stays selectable: config/cells/jurkat_v7_port.yaml.
  # em_cell1_v8p (B4, 2026-11-17) = em_cell1_v8 with the nuclear pore count set by the literature density checked
  # against the nucleoporin anchor (DECISION 2026-11-16): 11 NPC/um2 (Otsuka et al. 2016 eLife 5:e19071) x 245.1 um2
  # = 2,696 pores (the 1,000 v8 pores kept, 1,696 random added; toolkits/em/jpores.py; criteria B4_preplaced.md J1).
  toolkit: em
  # em_cell1_v8r (B6b, 2026-11-17) = em_cell1_v8p with rounded crista rims: engine param CR_RIM = 10 nm (= CR_W; the
  # lamella ends in a half-cylinder, where the ATP synthase dimer rows sit; toolkits/em/jrims.py; all content files
  # identical; criteria docs/unification_criteria/B6b_crista_rims.md). Only IMS -> matrix within 14.1 nm of crista rims.
  package: "{geom_root}/jurkat/em_cell1_v8r"
  manifest_sha256: 6c86b1688722f4320520abbb46a66fb7e9e97c95576e0186ebf3909b9c562fa1
  engine: sdf_sections_v1          # package layout (= manifest engine.name)
  evaluator: cellgeom_eval_v1      # the core evaluator: table-driven (wholecell/geometry/engines/cellgeom_eval_v1.py)
  rules: "{repo}/config/geometry/rules/sdf_sections_v1.yaml"   # its membrane table + label rule (cellgeom_v1.md §4.3)
  mc_points: 2000000               # Monte Carlo points for geometry/measures.json (seed stream geometry.measures)

# --- inventory (owner: inventory) ---
inventory:
  total_protein_pg: 100                 # REQUIRED (no default). Pedro DECISION 2026-11-08, bounds 80-130 pg
  total_protein_source: "DECISION 2026-11-08 (PLANNING_NOTES §4b); legacy inventory_v0.py was run as `inventory_v0.py 100` (code default 80 pg was stale)"
  copies:                               # generic copy-number step (wholecell/inventory/copies.py; spec inventory_schema.md §4b)
    method_id: jurkat_v0_legacy         # = legacy inventory_v0.py arithmetic (docs/reference/history/copies_regression_criteria.md C1-C7)
    annotation: {reader: uniprot_reviewed_genes, path: inv_uniprot_full}
    universe: {require: [sources, rna], order: sorted}     # reviewed genes with a detection or an RNA row
    value_column: ppb                   # relative value used for the molar fractions (legacy column name)
    sources:                            # priority order = list order (one source in v7)
      - id: inv_geiger2012_pg
        type: relative_ibaq
        unit: "iBAQ ppb (linear, E-PROT-20)"
        reader: maxquant_protein_groups
        path: inv_geiger2012_pg
        id_column: Majority.protein.IDs
        sample_match: Jurkat
        group_split: {rule: family_prefix, n: 3}   # a group's ppb split equally among genes sharing the first gene's 3-letter prefix (histones, tubulins)
        aggregate: median_detected
        column: ppb_geiger
        n_rep_column: n_rep
        label: geiger
    combine: {mode: priority}
    imputation:
      method: rna_loglog                # log10 ppb = a + b log10 TPM (detected genes, TPM > 0); capped at the 5th percentile of detected ppb
      rna: rna/rna.tsv
      tpm_column: tpm_median
      call_column: call
      floor_percentile: 5
      low_factor: 0.25
      zero_calls: ["off", no_rna]          # quoted: YAML reads a bare off as false
      labels: {expressed: imputed_rna, low: imputed_rna_low, zero: zero_off}
      flag_detected_off: "detected despite RNA off"
    absent:                             # zero lists with reasons (plugins/jurkat/data/inventory_v0.yaml, PLANNING_NOTES §4b)
      - {id: jurkat_zero_genes, file: "{repo}/plugins/jurkat/data/inventory_v0.yaml", genes_key: zero_genes, label: zero_override,
         reason: "verified loss / homozygous deletion"}
      - {id: jurkat_9p21_ifn, file: "{repo}/plugins/jurkat/data/inventory_v0.yaml", patterns_key: zero_patterns, label: zero_override,
         reason: "9p21 interferon cluster deletion", note: ""}   # note "": the legacy v0 left the note column empty for these
    per_protein_scaling: []             # none for Jurkat
    total_protein: {mode: fixed}        # = inventory.total_protein_pg (100 pg, DECISION 2026-11-08)
    adjustments:                        # after the total-mass scaling: only the listed proteins change (no renormalisation)
      # v8 copy fixes (DECISION Pedro 2026-11-19 evening; freeze_v8.md §0 D4, §5b): PDGFRB capped to its RNA-based estimate =
      # the value the copy step gives an undetected RNA `low` call, min(10^(a + b log10 TPM), floor) x low_factor =
      # min(10^(2.73207 + 0.76795 log10 0.195346), 97.3565) x 0.25 = 24.339126 ppb (fit / floor / TPM: inventory/copies of the
      # Step-2 build) -> copies = 24.339126 / 952,062,291.18 (sum of ppb) x 1,595,375,332.6 molecules = 40.785 (measured
      # Geiger 39,244 ppb -> 65,762: MS assignment artefact). family_target on the single gene keeps every other protein's
      # copies; PDGFRB's 0.0135 pg are not redistributed (total 99.9865 pg). SOS1 / SOS2 NOT changed (D5).
      # Checked by tests/test_copies.py::test_jurkat_copy_fixes and scripts/freeze_check.py G7 E8 (recomputed per build).
      - {rule_id: v8.copy_fixes, kind: family_target, match_on: key, members: {genes: [PDGFRB]},
         structure: "PDGFRB capped to its RNA-based estimate (undetected-low-call value 24.339 ppb)",
         target: {count: 40.785189997011194, source: "RNA-based estimate: min(fit, floor) x low_factor of the copy step at 100 pg"}}
    round_copies: true
    v0_columns: [uniprot, mass_da, ppb_geiger, n_rep, tpm, rna_call, source, ppb, note, copies]
    anchor_check: {use: final}
    anchors:                            # DIAGNOSTIC ONLY (total_protein.mode stays fixed): implied total protein per anchor
      - id: core_histones
        structure: nucleosome
        statistic: median
        families:                       # 2 of each core histone per nucleosome; all variants of a type pooled
          H2A: {stoich: 2, regex: "^(H2A|MACROH2A)"}
          H2B: {stoich: 2, regex: "^H2B"}
          H3: {stoich: 2, regex: "^(H3C\\d+|H3-\\w+|H3Y\\d+|CENPA)$"}
          H4: {stoich: 2, regex: "^(H4C\\d+|H4-\\w+)$"}
        counts:
          - {label: genome_mapped_v8, value: 28190000, primary: true, source: "chromatin v8 rep5: 28.19 M nucleosomes placed on 46 chains (PLANNING_NOTES chromatin v8; v7 NUCLEOSOME copies 28,190,641)"}
          - {label: dna_2n, value: 31000000, source: "3.1e7 from DNA content (PLANNING_NOTES §4b, v0-v6 NUCLEOSOME copies)"}
      - id: nucleoporins
        structure: nuclear pore complex
        statistic: median
        stoich_from_species: {table: inv_legacy_ingredients_v7, species_id: NPC}   # per-pore chain counts of PDB 7R5K (rule v4 d)
        filter_regex: "^(NUP\\d+\\w*|NDC1|AAAS|AHCTF1|RANBP2)$"                    # scaffold Nups (SEC13 / SEH1L also COPII / GATOR2: excluded)
        counts:
          - {label: em_np_seg, value: 300, primary: true, source: "np_seg instances on cell 1 after the 2026-11-08 re-assignment (PLANNING_NOTES §1; NP Dice 0.23: under-detected)"}
          - {label: model_geometry, value: 1000, source: "pores of the model NE (258 um2 x ~4 per um2; PLANNING_NOTES §4c, NPC pre-pass)"}
          - {label: model_geometry_b4, value: 2696, source: "pores of em_cell1_v8p: 11 NPC/um2 (Otsuka 2016) x 245.1 um2 (B4 J1)"}
      - id: ribosomal_proteins
        structure: cytosolic 80S ribosome
        statistic: median
        members: {regex: "^(RP[LS]\\d+(A|AL|L|L1|X|Y1|Y2)?|RPLP[012]|RACK1)$"}
        family_sub: ["^(RPL3|RPL10|RPL39|RPS27)L$|^(RPL22|RPL26)L1$|^(RPL36A)L$|^(RPS4)(X|Y1|Y2)$", "\\1\\2\\3\\4"]   # paralogs pooled with their family
        exclude: [RPL7L1]                  # ribosome biogenesis factor, not an r-protein (pseudogene-named group shares, e.g. RPL39P5, are not matched)
        stoich_overrides: {RPLP1: 2, RPLP2: 2}
        counts:
          - {label: em_recall_corrected, value: 1500000, primary: true, source: "755,935 ribo_seg / recall 0.45-0.55 = 1.4-1.7 M, central 1.5 M (PLANNING_NOTES §4-results 2026-11-08)"}
          - {label: em_raw, value: 755935, source: "ribo_seg instances, cell 1 (lower bound, recall ~0.5)"}
          - {label: em_recall_hi, value: 1700000, source: "upper end of the recall-corrected range"}
    future_sources:                     # declared slots, not enabled (no data yet)
      - {id: secms_fossati2021_abundance, type: secms_abundance, role: cross_check, enabled: false,
         notes: "summed SEC-MS intensity per protein (toolkits/secms profiles) vs the iBAQ copies; cross-check only"}
      - {id: jurkat_surface_proteomics, type: surface_proteomics, role: pm_copies, enabled: false,
         notes: "copy-number slot stays NOT enabled (freeze v8 D7): surface proteomics acts only via inventory.adapters.surface (presence evidence, surface.tsv); PM-copy use refused (pm_share fit did not validate)"}
  adapters:                             # registered names (wholecell.registry kinds adapter.<kind>)
    rna: jurkat.rna_e61
    proteome: copies                    # generic copy-number step (inventory.copies below); legacy jurkat.geiger_ibaq_v0 kept registered (equivalence test)
    localisation: localisation          # core evidence table + combiner + overrides (wholecell/inventory/localisation), preset in params below
    secms: secms_toolkit                # SEC-MS toolkit (toolkits/secms) -> inventory/secms/* (read by the assembly adapter)
    assembly: assembly_steps            # core assembly step list (wholecell/inventory/assembly), preset in params below
    surface: surface_proteomics         # freeze v8 D7: canonical surface.tsv, presence evidence only; does NOT change copies or localisation
  ingredients: jurkat.ingredients_v0    # inventory_builder
  rule_sets: [jurkat.v4, jurkat.v5, jurkat.v6, jurkat.v7]   # applied in order, each on the previous step's table
  proteome_sources:                     # -> canonical proteome_sources.tsv
    - {source_id: inv_geiger2012_pg, weight: 1.0, unit: "iBAQ ppb (linear, E-PROT-20)", normalisation: "median over detected Jurkat replicates; molar fraction x N with sum(copies x mass) = total_protein_pg", condition: "Jurkat, steady state", replicates: "Jurkat columns of the protein-group table"}
    - {source_id: rna_consensus, weight: 0.0, unit: "TPM (protein-coding renormalised)", normalisation: "imputation only: log10 ppb = a + b log10 TPM fitted on detected genes, capped at the 5th percentile of detected ppb; 'low' x0.25", condition: "E6-1, 5 bulk sources", replicates: "see inv_rna_*"}
  localisation_sources:                 # -> canonical localisation_sources.tsv (term_map: the curated TSV each adapter reads;
                                        # cleaned up in B5, DECISION 2026-11-17)
    - {source_id: inv_hpa_subcellular, weight: 0.5, evidence_codes: "HPA reliability Enhanced/Supported/Approved (Uncertain ignored); main 1.0, additional 0.3", term_map: "plugins/jurkat/data/localisation/hpa_term_map.tsv"}
    - {source_id: inv_uniprot_full, weight: 0.5, evidence_codes: "UniProt CC text (all statements, equal weight)", term_map: "plugins/jurkat/data/localisation/uniprot_cc_rules.tsv"}
    - {source_id: inv_itzhak2016, weight: 1.0, evidence_codes: "fractionation N/C class N, C, N/C with >= 3 good profiles; soluble proteins only", term_map: "N/C tie-breaker of the N/C model (HPA category NC; preset common)"}
  params:
    surface_proteomics:                 # freeze v8 D7 (config/fragments/jurkat_surface_proteomics.yaml; inventory_schema 4d)
      path: inv_surface_jurkat_glyco2026
      source_id: surface_glyco_jurkat2026
      conditions: [NAct, Act_0, Act_0_5h, Act_1h, Act_2h, Act_4h, Act_24h, Act_72h]
      recentre: complete_median
      baseline: [NAct, Act_0]
      min_detected: 3
      annotation: inv_uniprot_full
      mode: presence                    # presence only; pm_share refused (fit did not validate, DECISION 2026-11-19)
    jurkat.rna_e61:
      ens2sym_from: HPA_E6.1
      protein_coding_frozen: inv_uniprot_reviewed
      sources:                          # ordered = output column order
        HPA_E6.1: {reader: hpa_celline, frozen: inv_rna_hpa, cell_line: "Jurkat E6.1"}
        E-MTAB-2706: {reader: expression_atlas, frozen: inv_rna_emtab2706}
        GSE276689: {reader: rsem_mean, frozen: [inv_rna_gse276689_rep1, inv_rna_gse276689_rep2]}
        GSE145453: {reader: featurecounts_mean, frozen: [inv_rna_gse145453_a1, inv_rna_gse145453_a2]}
        GSE301789: {reader: deseq2_tpm_wt_ct, frozen: inv_rna_gse301789}
      kde_bw: 0.1
      z_expressed: -3                   # Hart 2013 zTPM
      z_off: -2.5
      min_sources_expressed: 2
    jurkat.geiger_ibaq_v0:
      proteome: inv_geiger2012_pg
      uniprot: inv_uniprot_full
      sample_match: Jurkat
      source_label: geiger
      floor_percentile: 5
      low_factor: 0.25
    localisation:                       # core localisation (docs/stages/localisation.md); B5 preset common (v7 = jurkat_v7_port)
      preset: common                    # presets/common.yaml (B5 switch; was legacy_v7)
      overrides: {}                     # deep-merged on the preset (only keys the preset has)
      label: jurkat.localisation_common   # provenance name (B5 switch; was jurkat.hpa_uniprot_itzhak_v0)
      genes: {input: inv_uniprot_full}  # gene -> UniProt accession + transmembrane feature (reviewed entries)
      sources:                          # evidence adapters -> inventory/localisation/evidence.tsv (in this order)
        - {source: hpa, adapter: hpa_subcellular, evidence_class: imaging_other, input: inv_hpa_subcellular,
           term_map: plugins/jurkat/data/localisation/hpa_term_map.tsv, main_score: 1.0, additional_score: 0.3}
        - {source: uniprot, adapter: uniprot_cc, evidence_class: annotation_curated, input: inv_uniprot_full,
           rules: plugins/jurkat/data/localisation/uniprot_cc_rules.tsv, drop_if_other: [secreted]}
        - {source: itzhak, adapter: fractionation_nc, evidence_class: fractionation, input: inv_itzhak2016,
           min_profiles: 3, classes: [N, C, N/C]}
      data:                             # Jurkat curation (TSVs with a reason column)
        membrane_keys: plugins/jurkat/data/localisation/membrane_keys.tsv
        overrides: plugins/jurkat/data/localisation/overrides_legacy_v7.tsv   # v4 c/f, v7 R4b/F1 rows (rule_id, reason, citation)
        chromatin_pool: plugins/jurkat/data/localisation/chromatin_pool.tsv   # preset common nc_model.chromatin (revision 2026-11-18)
      common:                           # cell data of preset `common` (B5; docs/unification_criteria/B5_localisation.md);
                                        # inert under legacy_v7. No key selection, no imaging groups (HPA keys = UniProt keys)
        default_key: unassigned         # no evidence (v7 fallback)
        nc_keys: [nucleus, cytosol]     # never new from imaging alone (the N/C model decides them)
        pool: {nucleus: nucleus, cytoplasm: [cytosol, cytoskeleton], default_cytoplasm: cytosol}
        nc_calibration:                 # "the current calibration": v6 R1 HPA category -> target N/C concentration ratio
          method: category
          source: hpa                   # main terms score >= main_min, additional below
          main_min: 1.0
          skip_main_keys: [mitochondrion, er, golgi, endolysosomal, peroxisome, lipid_droplet, nuclear_envelope]   # rules_v6.yaml organelle_terms
          ratios: {N: 10.0, Nc: 3.0, NC: 1.0, Cn: 0.3, C: 0.02}                # rules_v6.yaml r_by_category (fit-half Tier-2 calibration)
          tie_break: {categories: [NC], class: fractionation, background: 0.05, clip: [0.3333333333333333, 3.0]}   # Itzhak 2016 (rules_v6.yaml itzhak)
          exclude_genes_input: inv_holdout_genes   # the HPA-JURKAT hold-out half: no imaging calibration here (v6 R1 uses non-JURKAT consensus)
        # revision 2026-11-18 (docs/unification_criteria/B5_localisation_revision_2026-11-18.md)
        imaging_background:             # HPA nuclear background b: observed nuclear share = b + (1 - b) true (HPA only)
          sources: [hpa]
          nucleus_keys: [nucleus]
          b: 0.1931                     # estimate.json decision.b_HPA (branch intermediate; CI 0.1154-0.2675; extremes 0 / 0.3051 = sensitivity)
          provenance: "data/derived/v8/hpa_background/estimate.json (md5 895e677fb5b4825759c3a71e35cbbbb2; hpa_nuclear_background.py @ 8e2452a, branch hpa-background): OpenCell live HEK293T non-nuclear median 0.139 in Jurkat geometry vs HPA-Jurkat floor 0.305 -> b fitted 0.1931"
        chromatin: {regex: data.chromatin_pool}   # chromatin-bound genes: the whole pool stays in the nucleus
        nc_prior: {source: itzhak, background: 0.05, weight: 1.0, clip: [0.01, 100.0]}   # Itzhak 2016 N/(N+C) (rules_v6.yaml
                                        # itzhak nuclear_base 0.05); r clipped to [0.01, 100] (fn 0.007 .. 0.985 at Vn/Vc 0.67)
    jurkat.hpa_uniprot_itzhak_v0:       # LEGACY adapter, superseded by `localisation` (A5); kept for the equivalence test
      uniprot: inv_uniprot_full
      hpa: inv_hpa_subcellular
      itzhak: inv_itzhak2016
      hpa_main_weight: 1.0
      hpa_additional_weight: 0.3
      hpa_blend: 0.5                    # w = 0.5 HPA + 0.5 UniProt when both exist
      itzhak_nuclear_base: 0.05
      itzhak_min_profiles: 3
    assembly_steps:                     # core assembly steps (wholecell/inventory/assembly; docs/stages/assembly.md)
      preset: legacy_v7                 # Jurkat v7 assembly state exactly (presets/legacy_v7.yaml: steps + rule options)
      overrides:                        # deep-merged on the preset (only keys the preset has)
        # SEC-MS run feeding the rules (Step 3, 2026-11-19): the combined final estimate (secms_toolkit.combine label;
        # condition = replicate = 'combined', the only ones under this label). v7 = inv_sec_fossati_features (jurkat_v7_port)
        secms: {source_id: jurkat_final}
        # complex_portal.copies stays stoichiometry_cap (NOT measured_free_pool: Pedro 2026-11-16, not enabled for Jurkat;
        # Step 3: the gates of docs/reference/history/secms_toolkit_report.md §4 (size/pelleting, subcomplex windows,
        # recovery correction) are not implemented, so they cannot pass -> stays OFF)
      inputs:                           # frozen inputs
        complex_portal: inv_complex_portal
        sifts: inv_sifts
        pdb_assemblies: inv_pdb_assemblies
        pdb_listing_md5: adb5e849cfb6373aac7e121030b6152c    # md5 of the sorted file-name listing (48,189 files)
        # equal-coverage PDB candidates: the legacy pick (set order of a random-hash process) is reproduced from the
        # legacy complexes table; without a reference the first candidate in sorted order wins
        pdb_tiebreak_reference: inv_legacy_complexes_v0
        uniprot_reviewed: inv_uniprot_reviewed
        uniprot_full: inv_uniprot_full
        afdb_homodimers: inv_afdb_homodimer_table
        afdb_heterodimers: inv_afdb_heterodimer_table
        string_links: inv_string_links
      data:                             # Jurkat curation (TSVs with a reason column; PLANNING_NOTES §4c)
        complex_priority: plugins/jurkat/data/assembly/complex_priority.tsv     # built first: 60S, 40S, 26S, ..., NPC, CCT, ATP synthase, MCM
        complex_copy_caps: plugins/jurkat/data/assembly/complex_copy_caps_b4.tsv   # NPC = 2,696 = the pores of the geometry (B4 J1; v7: 1000)
        histone_families: plugins/jurkat/data/assembly/histone_families.tsv
        nucleosome:                     # DECISION 2026-11-08: nucleosome count from DNA (near-diploid male G1, DepMap ABSOLUTE CN 2)
          genome_bp: 6200000000         # bp per G1 cell
          bp_per_nucleosome: 200        # bp (core 147 + linker)
          mass_kda: 108.5               # histone octamer protein mass (DNA not counted)
          pdb: 1kx5
          complex_name_regex: '^Nucleosome|CENP-A nucleosome'   # Complex Portal rows replaced by the curated nucleosome
        homo_oligomer_exclude_regex: '^(ACT[BG]1|ACTA[12]|ACTC1|TUB[AB]\w*|SPT[AB]\w*|LMN[AB]\w*|VIM|KRT\d+\w*|SEPTIN\d+|NEFL|DES)$'   # built procedurally (polymers), no homo-oligomer state
        # SEC apex artefacts (Pedro 2026-11-19, Step 3): listed proteins skip the SEC apex check of pdb_homo_oligomers (keep
        # their PDB state); share_source_id = the SEC-MS run whose a_k gives the oligomer share (null = the rules' run).
        # Generic rule: wholecell/inventory/assembly/steps.py apex_check_exclude. Dry run: _dev_unify/step3_secms_hspd1.
        apex_check_exclude:
          - uniprot: P10809
            gene: HSPD1
            share_source_id: fossati2021_jurkat
            reason: "HSP60 heptamer (7azp, 6/8 PDB entries; 7 x 61 = 427 kDa) dissociates on the column in the lab 2026 runs (apex 147 kDa NT, 192 kDa TCRAct24h; ATP/HSP10-dependent ring); Fossati 2021 apex 480 kDa = heptamer -> share a_4 from Fossati (0.842 = the v7 / Step-2 value; combined a_4 0.466 would free 1.86 M copies)"
      workers: 8                        # processes for the PDB chain counts (legacy used 16; results identical)
    secms_toolkit:                      # toolkits/secms run config (docs/reference/inventory_schema.md §4a)
      # Step 3 (2026-11-19): the FINAL Jurkat SEC-MS assembly state = toolkits/secms/datasets/final2026_jurkat.yaml (same
      # datasets, same source_ids) + final2026_jurkat_combine.yaml (DECISION Pedro 2026-11-17, PLANNING_NOTES "SEC-MS final
      # estimates"): lab 2026 NT + TCRAct24h (unpublished lab data; no longer confidential since 2026-11-23) + Fossati 2021, equal weight, each
      # dataset calibrated on its own. Preset default = calibration on the curated native-mass anchors, anchor set v2
      # (v1 minus PFN1, HSP90AB1, YWHAZ, HSPA8), QC gate n >= 8, rho <= -0.7, residual <= x2.5 (fail = stop, no fallback).
      # The v7 run (preset legacy_v7, Fossati only, anchor set v1) stays in config/cells/jurkat_v7_port.yaml.
      species: human
      preset: default
      annotation: {path: inv_uniprot_reviewed}
      complexes: [{format: complex_portal, path: inv_complex_portal}]
      pair_candidates: {path: inv_afdb_heterodimer_table, a: uniprot_ac_1, b: uniprot_ac_2, require_true: passes_quality_threshold}
      datasets:
        - source_id: lab2026_jurkat_NT
          format: protein_long
          path: inv_sec_lab2026_jurkat_nt
          columns: {protein: input_id.y, fraction: r_fraction, intensity: pg_ibaq, condition: r_condition}
          duplicate_rows: unique        # precursor rows repeat the protein-group iBAQ
          exclude_ids_regex: '^NA$|^CON_'
          n_fractions: 54               # fractions 1-54 present (Act: 1-60)
          void_fraction: null           # unknown (column not documented)
          condition: JurkatNT
        - source_id: lab2026_jurkat_TCRAct24h
          format: protein_long
          path: inv_sec_lab2026_jurkat_tcract24h
          columns: {protein: input_id.y, fraction: r_fraction, intensity: pg_ibaq, condition: r_condition}
