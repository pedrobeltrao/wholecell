      assembly/afdb_homodimers_v0.tsv: "{data_root}/data/derived/afdb_homodimers_v0.tsv"
      assembly/afdb_heterodimers_v0.tsv: "{data_root}/data/derived/afdb_heterodimers_v0.tsv"
      rules/jurkat.v4/changes_legacy.tsv: "{data_root}/data/derived/inventory_v4_changes.tsv"
      rules/jurkat.v5/changes_legacy.tsv: "{data_root}/data/derived/inventory_v5_changes.tsv"
      rules/jurkat.v6/changes_legacy.tsv: "{data_root}/data/derived/inventory_v6_changes.tsv"
      rules/jurkat.v7/changes_legacy.tsv: "{data_root}/data/derived/inventory_v7_changes.tsv"
    ingredients:                        # species tables (B3 metrics: copies log2 ratio, comp_weights diff, species set)
      ingredients/ingredients.tsv: "{data_root}/data/derived/ingredients_v0_pre_v4.tsv"
      rules/jurkat.v4/ingredients.tsv: "{data_root}/data/derived/ingredients_v0_pre_v5.tsv"
      rules/jurkat.v5/ingredients.tsv: "{data_root}/data/derived/ingredients_v0_pre_v6.tsv"
      rules/jurkat.v6/ingredients.tsv: "{data_root}/data/derived/provenance/snapshots/ingredients_v6.tsv"
      rules/jurkat.v7/ingredients.tsv: "{data_root}/data/derived/ingredients_v7.tsv"
      pack_table.tsv: "{data_root}/data/derived/ingredients_v7.tsv"
    notes:
      - "Byte differences of intermediate tables are explained by two arbitrary legacy orders, never by content: (a) random PYTHONHASHSEED of each legacy process -> order of equal-weight keys in compartments/comp_weights, order of some change rows (v4 d/e pools), R3 evidence text order (v6, 21 rows), pick among equal-coverage PDB candidates (reproduced via inv_legacy_complexes_v0); (b) non-stable quicksort on another CPU -> row order among equal sort keys (complexes_v0, homo_oligomers_v0, afdb_homodimers_v0, ingredient rows)."
      - "Floating-point last-digit differences (rel <= 1e-14): rna zTPM (5 cells), inventory_v0 ppb of imputed genes (330 cells), sec_assembly apex_app_kda (70 cells); copies identical."
      - "pack_table.tsv borrows only row order and equal-content dict key order from inv_legacy_ingredients_v7 (pack_table_order.json: content_cells_differing must be 0)."

# --- library (owner: pack) ---
# B3 (2026-11-17; criteria docs/unification_criteria/B3_library.md): the library is BUILT per build by the core stage
# (mode build) with the Jurkat builder steps (wholecell/library/jurkat.py: the five legacy scripts that wrote the v7
# library in place, final code, run once each, offline). The frozen v7 library stays the start-entry source and the
# reference preset's library (config/cells/jurkat_v7_port.yaml: mode frozen).
library:
  mode: build
  start: {frozen: lib_structures_v7, files: plugins/jurkat/data/library/start_v7.tsv}   # pre-pass templates F_ACTB, MT_TUBA1B-TUBB4B (+ json)
  # species (one row per ingredient of the legacy table the v7 library was built from, ingredients_v0_pre_v4.tsv;
  # struct_src = the structure recorded in the v7 npz, which differs from the inventory's for 323 assemblies)
  species: plugins/jurkat/data/library/species_v7.tsv.gz
  pdb_dir: lib_pdb_assemblies        # RCSB assembly cache, read in place; offline (a missing entry is an error)
  nproc: 16                          # builder processes (results do not depend on it: one BLAS thread per process)
  jurkat:                            # inputs of the Jurkat steps (frozen-input names)
    afdb_tar: lib_afdb_human_tar
    afdb_tar_index: lib_afdb_human_tar_index
    afdb_fragment_index: lib_afdb_fragment_index_tmroute
    afdb_complex_models: lib_afdb_complex_models
    afdb_complex_models_manifest: plugins/jurkat/data/library/afdb_complex_models_manifest.tsv.gz
    uniprot_rest_cache: lib_tm_route_uniprot
    uniprot_topology: inv_uniprot_topology
    uniprot_table: lib_uniprot_human_table
    sifts: inv_sifts
  steps:                             # legacy order: jlib_build (+ jlib_rebuild_tm) -> reorient_tm -> tm_route -> lib_refine_st
    - {step: jurkat_assemblies, tm_graft: true}      # pdb / AFDB complex assemblies; TM ones oriented (AF graft of missing TM)
    - {step: jurkat_monomers}                        # AFDB v6 F1 per protein (pLDDT < 50 trimmed, TM oriented)
    - {step: reorient_tm}                            # 1-2-pass TM monomers: soluble blocks out of the slab
    - {step: tm_route, ids: plugins/jurkat/data/library/tm_route_ids.tsv}   # 129 TM-routed ingredients (v5 R3)
    - {step: adaptive_trees, include_membrane: true, max_ratio: 2.5, pers: [15, 8, 5]}   # sphere trees <= 2.5x volume
    - {step: pm_topology_fix, table: plugins/jurkat/data/library/pm_topology_fix.tsv}   # freeze v8 E7: 13 glyco-captured units ectodomain exoplasmic + TRBC1 by TM alternation
  # P8 packing shapes (written for B1; the B3 pack keeps the library's own adaptive trees, pack.shapes source library)
  pack_shapes: {per: 15, max_beads: 20000}

# --- preplaced: pre-placed structures (owner: pack; "prepass" before A0c) ---
preplaced:
  numba_threads: 8
  # B4 (2026-11-17; criteria docs/unification_criteria/B4_preplaced.md): the common pre-placed builders (one core
  # module each, wholecell/preplaced/builders/) run in one serial pass on the core context; their layers replace the
  # frozen v7 polysomes, traced MTs, NPCs and mRNA. Chromatin rep5, the lamina (frozen copy), nascent RNA and the
  # centrioles + cortical F-actin of the v7 cytoskeleton stay frozen (the last selected by kind at build time).
  # The v7 layers: config/cells/jurkat_v7_port.yaml.
  serial:
    context: core.cellgeom
    context_params:
      libs: [NPC, MT_TUBA1B-TUBB4B, RIBO80S, CPX-6151]
      obstacles:                   # frozen instances the builders avoid (centrioles = kind 0, cortical F-actin = kind 2)
        - {name: centrioles, npz: pre_cytoskeleton_v7, kind_key: kind, kinds: [0], obs: centrioles}
        - {name: cortical_actin, npz: pre_cytoskeleton_v7, kind_key: kind, kinds: [2], obs: actin, shape: bounding}   # 14.4 M subunits: one sphere each
    out: preplaced/serial
    builders:
      # 7R5K per pore. drop_frozen (npc-overlap fix 2026-11-17): the pores are geometry (J1: one NPC per pore), so frozen
      # centriole / cortical actin instances overlapping an NPC are dropped (the v7 cytoskeleton predates the 1,696 added
      # pores; B4 addendum J5b cytoskeleton_rest-npc 28 pairs); logged, out of the obstacle sets and of cytoskeleton_rest
      - {name: npc, builder: core.npc_pores, params: {lib_id: NPC, seed: preplaced.npc, n_pores: 2696, drop_frozen: [centrioles, actin]}}
      - name: microtubules         # the EM-traced polylines (package layer mt_traces), 13_3 lattice as v7
        builder: core.microtubules
        params: {tracks: traced, layer: mt_traces, lib: MT_TUBA1B-TUBB4B, ingredient: TUBA1B-TUBB4B,
                 seed: 20261111,         # the v7 stage-3 lattice frame seed: same lattice (dimer phase) as v7
                 obstacles: [npc, centrioles], labels: [cytosol], obstacle_shape: bounding}   # mt_all: one sphere per dimer
      - name: atp_synthase         # dimer rows on the rims of the lamellar cristae (human monomer CPX-6151, 8H9T)
        builder: core.atp_synthase_dimers
        # B6b (2026-11-17): on the rounded rims of em_cell1_v8r the yeast dimer (84 deg, 8.8 nm) is used unchanged; at the
        # frozen 2.5 nm TM tolerance it still places 0 dimers (the flat ~9.5 nm TM footprint of each monomer cannot lie
        # within 2.5 nm of ANY smooth rim: ideal-cylinder bound 2.5-2.7 nm); tm_tol 3.0 / 3.5 / 4.5 -> 14 / 674 / 1,809
        # dimers (square v8p: 0 / 1 / 21). J6 tolerance: decided 2026-11-18, see below (B6b_crista_rims_addendum_2026-11-17.md)
        # J6 (B4 addendum 2026-11-18, docs/unification_criteria/B4_preplaced_addendum_J6_2026-11-18.md): tm_tol 4.5 nm accepted
        # on the rounded rims; rim sampling `rows` = dense rim lines (seeds_per_cell seeds per enabled cristae id cell, each
        # rim line traced every trace_step_nm and walked: a dimer tried at every trace point, then one row spacing on);
        # spacing_nm 12 = dimer spacing along the rows (~12 nm, Strauss et al. 2008 EMBO J 27:1154; 12 to > 20 nm,
        # Davies et al. 2011 PNAS 108:14121); tilt_deg: dimer tilts about the rim tangent tried in order (the rims of
        # oblique lamellae are sheared: their cap normal leaves the slab plane). Literature: 50-83 dimers per um of rim.
        # obstacles: [npc] (the pores next to mitochondria: 23 NPC-dimer overlaps at 0.5 nm without it).
        params: {rims: lamellae, monomer: CPX-6151, seed: preplaced.atp_synthase, dimer_angle_deg: 84.0, rim_radius_nm: 8.8,
                 tm_tol_nm: 4.5, rho_nm: [10, 9, 11, 8, 12, 7, 13, 6.5], rim_sampling: rows, seeds_per_cell: 1.0,
                 trace_step_nm: 2.0, spacing_nm: 12.0, tilt_deg: [0, -10, 10, -20, 20], obstacles: [npc]}
      - name: mtdna                # nucleoids in the matrix: 1,000 genomes (ASSUMPTION; O'Hara 2019), 1.4 per nucleoid (Kukat 2011)
        builder: core.mtdna_nucleoids
        params: {sites: matrix, seed: preplaced.mtdna, genomes: 1000, genomes_per_nucleoid: 1.4, genome_kb: 16.569, min_gap_nm: 500.0,
                 obstacles: [atp]}
      - name: polysomes            # yeast walk seeded by the EM ribosomes (point priors); free 80S are packed
        builder: core.polysomes
        params:
          seed: preplaced.polysomes
          transcripts_seed: preplaced.polysomes.transcripts
          ribosome: RIBO80S
          pool_region: null                    # pool = the pack-table RIBO80S copies
          polysome_fraction: 0.70              # B4 J3: this cell's EM, 0.697 of de-duplicated EM ribosomes in 34-nm groups of >= 2
          channel: "repo:plugins/jurkat/data/preplaced/RIBO80S_mrna_channel.npy"     # 7ZW0 channel via rRNA superposition (scripts/dev/ribosome_channel_transfer.py)
          disome: "repo:plugins/jurkat/data/preplaced/RIBO80S_disome_6I7O.npy"
          transcripts: {table: jurkat.mrna_table, npz: pre_mrna_v1, kinds: [0, 1], occupancy: 0.79, max_ribo: 40}   # v1: 170,410 of 215,000 cytosolic mRNAs on ribosomes
          obstacles: [npc, mt_all, centrioles, actin]
          start_radius_slot: 0                 # random chain starts within the enclosing radius
          mrna_step_nm: 3.0                    # polysome mRNA polylines and linker beads every 3 nm (5 nt; yeast 0.5 nm)
          # Linker of the walk (B4 addendum 2026-11-17, docs/unification_criteria/B4_preplaced_addendum_2026-11-17.md §1):
          # mean free nt between neighbouring ribosomes, MEASURED from this cell's EM ribosomes (val_ribo_em, ribo_seg
          # cell 1, non-nuclear) on the calibration subset (model frame, 1-um blocks with (i + 2j + 3k) mod 5 == 0; not the
          # J3b / J4 evaluation): scan 5 / 20 / 60 / 90 / 120 / 150 / per-transcript (B4 default, ~191 nt), each value a
          # full polysome walk; value = argmin |NN - EM| / 1 nm + |linked - EM| / 0.05 (model + random cytosolic
          # complement, thinned as J3b / J4) among the values keeping J3a 0.68-0.72 (60 nt fits best unconstrained but
          # ends chains short: J3a 0.651). Subset EM: NN 27.20 nm, linked 0.691; at 150 nt: 35.38 nm, 0.437 (default
          # 35.70, 0.426): the linker cannot reach the EM values (centre spacing floor ~27 nm, the disome pose).
          # scripts/dev/b4_polysome_calibration.py; results jurkat/_dev_unify/b4/addendum_20261117/calib/calibration.json
          linker_nt_mean: 150.0
          # Walk search (walk fix 2026-11-18, docs/unification_criteria/B4_preplaced_addendum_polysomes_2026-11-18.md):
          # every grown ribosome is the fitting candidate nearest the chain's centroid among 40 poses per round (entry
          # direction within 45 deg of the link), up to 30 rounds (free nt redrawn per round; the legacy budget 40 x 30 =
          # 1,200 tries) before the chain ends. Chosen on the calibration subset of the addendum (walk_fix/calib):
          # subset NN 35.38 -> 33.40 nm, linked 0.437 -> 0.499, J3a 0.684 -> 0.688. Default (absent) = legacy walk (yeast).
          walk: {candidates: 40, rounds: 29, pick: compact, orient_cone: 0.7854}
          point_priors: {table: val_ribo_em, filter_eq: {cell2: 1}, filter_not_in: {cls: [2]}, voxel_nm: [4.0, 4.0, 3.44],
                         class_col: cls, er_classes: [3, 4], dedup_nm: 20.0, link_nm: 34.0, max_group: 40, nudge_nm: 10.0,
                         prior_tries: 60, er_membrane: ER, er_tmax_nm: 45.0, seed: preplaced.polysomes.priors}
      - name: mrna                 # threads through the chains + free mRNAs, 5 nt per bead (v7 mRNA representation)
        builder: core.mrna_threads
        params: {seed: preplaced.mrna, ribosome: RIBO80S, nt_per_bead: 5, rac: false, ribosome_tree_per: 550,
                 obstacles: [actin, centrioles, mt_all, npc, "@ribosomes", "@links", monosomes]}
    exports:                       # module files for the pack index (preplaced/serial/modules/)
      - {module: npc, group: npc}
      - {module: microtubules, group: microtubules}
      - {module: polysomes, group: polysomes}
      - {module: atp_synthase, group: atp_synthase}
      - {module: cytoskeleton_rest, frozen_subset: {npz: pre_cytoskeleton_v7, key: kind, values: [0, 2],
                                                    lib_to_ingredient: {MT_TUBA1B-TUBB4B: TUBA1B-TUBB4B, F_ACTB: ACTB}}}
      - {module: mrna, beads: {pts: mrna_pts, offsets: mrna_off, radius: 1.0, extra: {kind: mrna_kind}}}
      - {module: mrna_nuclear, frozen_subset: {npz: pre_mrna_v1, key: kind, values: [2]}}
      - {module: mtdna, beads: {pts: mtdna_pts, offsets: mtdna_off, radius: 1.0}}
  modules:                         # order = pre-pass library order of the pack index
    # depends_on_geometry (frozen modules): the package each frozen file was checked against; mode serial = built
    # in this build by the serial pass (files under preplaced/serial/modules/)
    - {name: chromatin, kind: instances, mode: frozen, npz: pre_chromatin_v8_rep5, json: pre_chromatin_v8_rep5_json, depends_on_geometry: jurkat/em_cell1_v8r}   # B6b: labels outside the mitochondria identical to v8p
    - {name: polysomes, kind: instances, mode: serial, npz: "build:preplaced/serial/modules/polysomes.npz", json: "build:preplaced/serial/modules/polysomes.json"}
    - {name: microtubules, kind: instances, mode: serial, npz: "build:preplaced/serial/modules/microtubules.npz", json: "build:preplaced/serial/modules/microtubules.json"}
    - {name: cytoskeleton_rest, kind: instances, mode: serial, npz: "build:preplaced/serial/modules/cytoskeleton_rest.npz", json: "build:preplaced/serial/modules/cytoskeleton_rest.json"}
    - {name: npc, kind: instances, mode: serial, npz: "build:preplaced/serial/modules/npc.npz", json: "build:preplaced/serial/modules/npc.json"}
    - {name: atp_synthase, kind: instances, mode: serial, npz: "build:preplaced/serial/modules/atp_synthase.npz", json: "build:preplaced/serial/modules/atp_synthase.json"}
    - name: lamina
      kind: instances
      # B4: mode build. The frozen v7 lamina excludes rods only around the 1,000 v7 pores; on em_cell1_v8p (2,696 pores)
      # it overlaps the new NPCs (pre-build check: 2,511 lamina-NPC overlap pairs on the 300 sampled tiles). The rebuilt
      # lattice (same builder and seed, pore exclusion on the package pores) is used; compare_frozen.json still written.
      # Inventory rule L3 keeps the frozen v7 lamina consumption (inv_lamina_consumption_v7; the rebuilt lattice consumes
      # ~2.6 % more lamins: the pack takes them from the lamina key, clipped at 0).
      mode: build                  # build | frozen; the rebuild is always run and compared (B5): see preplaced/lamina/compare_frozen.json
      rebuild_check: true
      builder: lamina_lattice
      seed_stream: prepass.lamina  # legacy seed 20261112 (seeds.legacy); stream name kept at A0c
      params: {genes: [LMNB1, LMNB2, LMNA], inventory_key: lamina, patch_nm: 500.0, pore_x_nm: 80.0, pore_z_nm: 150.0,
               lat_f: 1.0, priority: chromatin}      # logs/v7_full2.sh: LAMINA_PRIORITY=chromatin
      inputs: {chromatin: "module:chromatin", table: "build:inventory/rules/jurkat.v6/ingredients.tsv", ne_mesh: "layer:ne_mesh"}
      frozen: {npz: pre_lamina_v7, json: pre_lamina_v7_json, drop_json: pre_chromatin_drop_lamina_v7}
      drops_target: chromatin
    - {name: mrna, kind: beads, mode: serial, npz: "build:preplaced/serial/modules/mrna.npz"}
    - {name: mrna_nuclear, kind: beads, mode: serial, npz: "build:preplaced/serial/modules/mrna_nuclear.npz"}
    - {name: mtdna, kind: beads, mode: serial, npz: "build:preplaced/serial/modules/mtdna.npz"}
    - {name: mrna_nascent, kind: beads, mode: frozen, npz: pre_mrna_nascent_v8, depends_on_geometry: jurkat/em_cell1_v8r}   # B6b: labels outside the mitochondria identical to v8p

# --- pack (owner: pack) ---
pack:
  # legacy jwc.py / jpack_test.py constants and JWC_* switches (v7 values)
  tile_nm: 500.0                   # TILE
  vox_nm: 4.0                      # VOX: volume seed voxels
  mesh_h_nm: 8.0                   # MESH_H: marching-cubes spacing of the packing meshes
  meas_h_nm: 8.0                   # MEAS_H: tile measures
  halo_nm: 40.0                    # HALO
  tile_keep_half_diag_f: 0.87      # keep tiles whose centre is deeper than -f x TILE below the cell surface
  max_tries: 200                   # JWC_MAX_TRIES
  give_up: 25                      # JWC_GIVE_UP
  thin_try_f: 10.0                 # JWC_THIN_TRY_F (v7)
  thin_giveup_f: 16.0              # JWC_THIN_GIVEUP_F (v7)
  seed_prune: false                # JWC_SEED_PRUNE
  lumen_align: true                # not JWC_NO_LUMEN_ALIGN
  shell_area_factor: true          # not JWC_GOLGI_SHELL_FULL (v6+: shells of an area-factor membrane at the modelled share)
  mrna_mean: 1500.0                # pack_tile argument (procedural mRNA off in jwc)
  numba_threads: 8                 # counts/index steps (tiles/pack workers are single-threaded)
  thin_lumens: {ER_lumen: ER, golgi_lumen: GOLGI, perinuclear: NE, matrix: MITO_IM}   # LUMEN_MEM (+ JWC_MATRIX_THIN=1)
  regions:                         # = jpack_test.RNAMES_V7 (index = job_region id)
    - {name: cytosol, kind: volume, labels: [cytosol]}
    - {name: nucleoplasm, kind: volume, labels: [nucleoplasm]}
    - {name: matrix, kind: volume, labels: [mito_matrix]}
    - {name: ER_lumen, kind: volume, labels: [er_lumen]}
    - {name: golgi_lumen, kind: volume, labels: [golgi_lumen]}
    - {name: endo_lumen, kind: volume, labels: [endolysosome_lumen]}
    - {name: perinuclear, kind: volume, labels: [perinuclear_space]}
    - {name: nucleolus, kind: volume, labels: [nucleolus]}
    - {name: speckle, kind: volume, labels: [nuclear_speck]}
    - {name: mt_lattice, kind: virtual, labels: [cytosol], provider: cyto_v7, select: mt_lattice}
    - {name: mt_plus, kind: virtual, labels: [cytosol], provider: cyto_v7, select: mt_plus}
    - {name: pcm, kind: virtual, labels: [cytosol], provider: cyto_v7, select: pcm}
    - {name: vim_cage, kind: virtual, labels: [cytosol], provider: cyto_v7, select: vim_cage}
    - {name: PM, kind: membrane, membrane: PM}
    - {name: NE, kind: membrane, membrane: NE}
    - {name: ER, kind: membrane, membrane: ER}
    - {name: MITO_OM, kind: membrane, membrane: MITO_OM}
    - {name: MITO_IM, kind: membrane, membrane: MITO_IM}
    - {name: GOLGI, kind: membrane, membrane: GOLGI}
    - {name: ENDO, kind: membrane, membrane: ENDO}
    # shells: d1 (+ MEM_HALF of the membrane if d1_mem_half) nm from the midsurface; add_radius: + library bounding radius
    - {name: sh_PM_cyto, kind: shell, membrane: PM, labels: [cytosol], side: 1, d0: 0, d1: 2.0, d1_mem_half: true, add_radius: true}
    - {name: sh_PM_exo, kind: shell, membrane: PM, labels: [exterior], side: -1, d0: 0, d1: 2.0, d1_mem_half: true, add_radius: true}
    - {name: sh_PM_cortex, kind: shell, membrane: PM, labels: [cytosol], side: 1, d0: 0, d1: 150.0, d1_mem_half: false, add_radius: false}
    - {name: sh_NE_lamina, kind: shell, membrane: NE, labels: [nucleoplasm], side: 1, d0: 0, d1: 25.0, d1_mem_half: true, add_radius: false}
    - {name: sh_NE_nuc, kind: shell, membrane: NE, labels: [nucleoplasm], side: 1, d0: 0, d1: 2.0, d1_mem_half: true, add_radius: true}
    - {name: sh_ER_cyto, kind: shell, membrane: ER, labels: [cytosol], side: 1, d0: 0, d1: 2.0, d1_mem_half: true, add_radius: true}
    - {name: sh_ER_lumen, kind: shell, membrane: ER, labels: [er_lumen], side: -1, d0: 0, d1: 2.0, d1_mem_half: true, add_radius: true}
    - {name: sh_GOLGI_cyto, kind: shell, membrane: GOLGI, labels: [cytosol, golgi_intercisternal], side: 1, d0: 0, d1: 2.0, d1_mem_half: true, add_radius: true}
    - {name: sh_GOLGI_lumen, kind: shell, membrane: GOLGI, labels: [golgi_lumen], side: -1, d0: 0, d1: 2.0, d1_mem_half: true, add_radius: true}
    - {name: sh_ENDO_cyto, kind: shell, membrane: ENDO, labels: [cytosol], side: 1, d0: 0, d1: 8.0, d1_mem_half: true, add_radius: true}   # ENDO_AH (v7)
    - {name: sh_ENDO_lumen, kind: shell, membrane: ENDO, labels: [endolysosome_lumen], side: -1, d0: 0, d1: 2.0, d1_mem_half: true, add_radius: true}
    - {name: sh_OM_cyto, kind: shell, membrane: MITO_OM, labels: [cytosol], side: 1, d0: 0, d1: 2.0, d1_mem_half: true, add_radius: true}
    - {name: sh_NPC, kind: shell, membrane: NE, labels: [cytosol, nucleoplasm], side: 1, d0: 0, d1: 100.0, d1_mem_half: true, add_radius: true, pore_limit_nm: 200}   # NPC_D, NPC_LAT
    - {name: sh_PM_periph, kind: shell, membrane: PM, labels: [cytosol], side: 1, d0: 0, d1: 20.0, d1_mem_half: true, add_radius: true}   # PERIPH_D
    - {name: sh_ENDO_periph, kind: shell, membrane: ENDO, labels: [cytosol], side: 1, d0: 0, d1: 20.0, d1_mem_half: true, add_radius: true}
    - {name: sh_GOLGI_periph, kind: shell, membrane: GOLGI, labels: [cytosol, golgi_intercisternal], side: 1, d0: 0, d1: 20.0, d1_mem_half: true, add_radius: true}
    - {name: sh_NPC_fg, kind: shell, membrane: NE, labels: [nuclear_pore_channel, cytosol, nucleoplasm], side: 1, d0: 0, d1: 100.0, d1_mem_half: true, add_radius: true, pore_limit_nm: 25}   # NPC_FG_LAT
  virtual_providers:
    - id: cyto_v7
      plugin: jurkat.cytoskeleton_v7
      params: {band_nm: [14.0, 26.0], plus_l_nm: 400.0, plus_min_l_nm: 1000.0, r_pcm_nm: 400.0, vim_d_nm: 300.0}
      inputs: {mt_centerlines: "layer:mt_traces", cytoskeleton_json: "layer:centrosome", ne_mesh: "layer:ne_mesh"}
  region_map_default: {soluble: cytosol, tm: ER}
  region_map:                      # localisation key -> region (= jpack_test.SOL / TMR with the v7 updates)
    cytosol: {soluble: cytosol, tm: ER}
    cytoskeleton: {soluble: cytosol, tm: ER}
    peroxisome: {soluble: cytosol, tm: ER}
    lipid_droplet: {soluble: cytosol, tm: ER}
    unassigned: {soluble: cytosol, tm: ER}
    plasma_membrane: {soluble: cytosol, tm: PM}
    nucleus: {soluble: nucleoplasm, tm: NE}
    nuclear_envelope: {soluble: nucleoplasm, tm: NE}
    mitochondrion: {soluble: matrix, tm: MITO_IM}
    er: {soluble: ER_lumen, tm: ER}
    secreted: {soluble: ER_lumen, tm: ER}
    golgi: {soluble: golgi_lumen, tm: GOLGI}
    endolysosomal: {soluble: endo_lumen, tm: ENDO}
    nucleolus: {soluble: nucleolus, tm: NE}
    pm_anchor_cyto: {soluble: sh_PM_cyto, tm: PM}
    pm_anchor_exo: {soluble: sh_PM_exo, tm: PM}
    cortex: {soluble: sh_PM_cortex, tm: PM}
    lamina: {soluble: sh_NE_lamina, tm: NE}
    ne_anchor_nuc: {soluble: sh_NE_nuc, tm: NE}
    er_anchor_cyto: {soluble: sh_ER_cyto, tm: ER}
    er_anchor_lumen: {soluble: sh_ER_lumen, tm: ER}
    golgi_anchor_cyto: {soluble: sh_GOLGI_cyto, tm: GOLGI}
    golgi_anchor_lumen: {soluble: sh_GOLGI_lumen, tm: GOLGI}
    endo_anchor_cyto: {soluble: sh_ENDO_cyto, tm: ENDO}
    endo_anchor_lumen: {soluble: sh_ENDO_lumen, tm: ENDO}
    om_anchor_cyto: {soluble: sh_OM_cyto, tm: MITO_IM}
    speckle: {soluble: speckle, tm: NE}
    npc: {soluble: sh_NPC, tm: NE}
    pm_periph_cyto: {soluble: sh_PM_periph, tm: PM}
    endo_periph_cyto: {soluble: sh_ENDO_periph, tm: ENDO}
    golgi_periph_cyto: {soluble: sh_GOLGI_periph, tm: GOLGI}
    mt_lattice: {soluble: mt_lattice, tm: ER}
    mt_plus: {soluble: mt_plus, tm: ER}
    pcm: {soluble: pcm, tm: ER}
    vim_cage: {soluble: vim_cage, tm: ER}
    npc_fg: {soluble: sh_NPC_fg, tm: NE}
  mapping_rules:                   # applied in order after the map (generic; jwc.step_counts)
    tm: [{if_region: MITO_IM, column: mito_om_frac, op: ge, value: 0.5, to: MITO_OM}]                   # OM vs IM
    soluble: [{if_region_in: [ER_lumen, golgi_lumen, endo_lumen], column: signal_frac, op: lt, value: 0.5, to: cytosol}]   # signal-peptide lumen rule
  area_factors:                    # inventory membrane area / modelled area (CRISTAE_F, GOLGI_STACK_F; measured when built)
    - {membrane: MITO_IM, factor: 3.0, measured: {when_flag: G_CRISTAE, mode: ref_membrane, ref: MITO_OM}}
    - {membrane: GOLGI, factor: 4.5, measured: {when_flag: G_GOLGI_CIS, mode: summary_area_um2, key: [golgi, area_um2]}}
  open_face: {when_flag: G_FACE, summary_key: open_face, membranes: [PM]}   # f_pm for PM + PM shells, f_vol otherwise
  index_drops:                     # pre-pass instances dropped at indexing (jwc.step_index)
    - {name: open_face_cortical_actin, libs: [F_ACTB], when_flag: G_FACE, mode: face_band, z_above_face_nm: 160.0, membrane: PM, min_sdf_nm: 150.0}   # FACE_ACTIN
    - {name: speckle_chromatin, libs: [NUCLEOSOME], lib_prefixes: ["H1-"], when_flag: G_SPECKLE, mode: g_spheres, section_slot: G_SPECKLE}
    # B6 (criteria C3): frozen pre-placed instances whose centre lies in the NE lumen of em_cell1_v8 (cytosolic items
    # within ~25 nm outside the NE midsurface, where the v7 ne_mid defect put cytosol)
    - {name: ne_lumen_b6, lib_prefixes: [""], mode: inside_labels, labels: [perinuclear_space]}
  # organisation layer (B2, accepted; criteria docs/unification_criteria/B2_organisation.md): STRING v12 human,
  # combined score >= 400, AlphaFold 3 pool OFF (published setting). Other constants: switches.DEFAULTS (the yeast X5
  # values); field seed: stream pack.organisation.field of the master seed. Off in jurkat_v7_port.yaml.
  organisation:
    enabled: true
    string:
      taxon: 9606
      version: "12.0"
      links: inv_string_links          # 9606.protein.links.v12.0.txt.gz (frozen input, md5 5b7c91d0...)
      min_score: 400                   # combined score (yeast organisation.STRING_MIN; A7 phase 2 testcell run)
      ids: {table: inv_uniprot_full, columns: [STRING]}   # UniProt STRING cross-reference "9606.ENSP..." -> Entry
    genes: {table: inv_uniprot_full, columns: ["Gene Names (primary)"]}   # complex subunits given as gene symbols
    pool_scores: null                  # AF3 pool OFF (Pedro: published builds use STRING only)
    paralogs: null
    # freeze fix 2026-11-19 (main session): crowded volume regions = placed mass fraction < 0.95 in the reference build
    # (B3 20261117-bc121a6, B1.K2: nucleolus 0.864; matrix 0.860 and ER_lumen 0.814 are thin lumens, limited by membrane
    # clearance, not crowding: not listed); there the field may not raise a tile's requested mass above the unmodulated
    # split (switches.py, requests.field_cap)
    field_cap_regions: [nucleolus]

# --- validate (owner: validate) ---
validate:
  nproc: 8
  steps: {}                          # <step>: false disables a step (it then writes <step>.skipped.json)
  inputs:                            # the build's pack inputs used by validation, if no preplaced/preplaced_manifest.json names them
    polysomes: "{data_root}/data/derived/prepass_v7/polysomes_cell1.npz"
    mrna: "{data_root}/data/derived/prepass/mrna_cell1.npz"
    mrna_nascent: "{data_root}/data/derived/chromatin/v8/prepass/mrna_nascent_cell1.npz"
  densities:
    default_region: cytosol
    virtual_to: cytosol              # virtual regions are cytosol voxels (volumes overlap)
    shell_to_volume:                 # shells add their mass to the volume region they occupy (sh_PM_exo: extracellular, not counted)
      sh_PM_cyto: cytosol
      sh_PM_cortex: cytosol
      sh_NE_lamina: nucleoplasm
      sh_NE_nuc: nucleoplasm
      sh_ER_cyto: cytosol
      sh_ER_lumen: ER_lumen
      sh_GOLGI_cyto: cytosol
      sh_GOLGI_lumen: golgi_lumen
      sh_ENDO_cyto: cytosol
      sh_ENDO_lumen: endo_lumen
      sh_OM_cyto: cytosol
      sh_PM_periph: cytosol
      sh_ENDO_periph: cytosol
      sh_GOLGI_periph: cytosol
    shell_split:                     # NPC shells sit on both NE faces
      sh_NPC: {cytosol: 0.5, nucleoplasm: 0.5}
      sh_NPC_fg: {cytosol: 0.5, nucleoplasm: 0.5}
    preplaced_volume:                # pre-pass library (fnmatch pattern) -> volume region; others -> default_region
      NUCLEOSOME: nucleoplasm
      "H1-*": nucleoplasm
      CPX-2387: nucleoplasm
      CTCF: nucleoplasm
      CPX-5989: nucleoplasm
      CPX-5991: nucleoplasm
      LMNB1: nucleoplasm
      LMNB2: nucleoplasm
      LMNA: nucleoplasm
    nucleus_group: [nucleoplasm, nucleolus, speckle]
    ratio_denominator: cytosol
    mrna_sources:                    # RNA mass = sum of thread nt x 330 Da per source (the build's own inputs)
      - {input: mrna, region: cytosol}
      - {input: mrna_nascent, region: nucleoplasm}
  crowding:
    regions: [cytosol, nucleoplasm, matrix, ER_lumen]
    n_boxes: 4
    box: 150.0
    vox: 0.5
    margin: 25.0
    probes: [0.0, 1.0, 1.6, 2.3, 3.0]
    legacy_seeds: true               # box choice seed 1, calibration seed 0, walk seed = tile id (as the v7 run)
  loc_compare:
    vocab: "{repo}/config/validate/loc_vocab_human.yaml"
    cell_line: JURKAT
    references:                      # frozen inputs (val_*)
      hpa_consensus: val_hpa_subcellular
      uniprot: val_uniprot_human
      opencell: val_opencell
      hpa_celllines: val_hpa_celllines
      holdout_genes: val_loc_holdout_genes
      fit_genes: val_loc_fit_genes
    holdout_exclude: [CD3E, CD3D]    # DECISION Pedro 2026-11-10: rule R4b was motivated by their held-out disagreement
    clean_sets: [opencell, hpa_jurkat_holdout_half]
    families: [H2A, H2B, H3, H4]     # pack-table gene tokens expanded to inventory members (copies-weighted)
    family_regex: '^{f}(C|-)\d'
    fractionation_source_tag: itzhak
    soluble_default: cytosol
    tm_default: ER
    lumen_rule: {regions: [ER_lumen, golgi_lumen, endo_lumen], field: signal_frac, min: 0.5, else: cytosol}
    tm_override: {MITO_IM: {field: mito_om_frac, min: 0.5, region: MITO_OM}}
    consumed_key: {LMNB1: lamina, LMNB2: lamina, LMNA: lamina}   # pre-pass consumption taken from this key only
    pm_regions: [PM, sh_PM_cyto, sh_PM_exo, sh_PM_cortex, sh_PM_periph]
    preplaced_ingredient: {NUCLEOSOME: NUCLEOSOME, NPC: NPC, RIBO80S: RIBO80S, MT_TUBA1B-TUBB4B: TUBA1B-TUBB4B, F_ACTB: ACTB, CPX-6151: CPX-6151}
    preplaced_region:                # pre-pass library (fnmatch) -> region for localisation; others cytosol
      F_ACTB: sh_PM_cortex
      LMNB1: sh_NE_lamina
      LMNB2: sh_NE_lamina
      LMNA: sh_NE_lamina
      CPX-2387: nucleoplasm
      CTCF: nucleoplasm
      CPX-5989: nucleoplasm
      CPX-5991: nucleoplasm
      NUCLEOSOME: nucleoplasm
      "H1-*": nucleoplasm
      NPC: NE
      CPX-6151: MITO_IM              # ATP synthase dimer rows (B4)
    preplaced_region_default: cytosol
    reg2comp:                        # model region -> comparison compartment (light-microscopy resolution)
      cytosol: cytosol
      nucleoplasm: nucleus
      matrix: mito
      ER_lumen: ER
      golgi_lumen: golgi
      endo_lumen: endolysosomal
      perinuclear: NE
      PM: PM
      NE: NE
      ER: ER
      MITO_OM: mito
      MITO_IM: mito
      GOLGI: golgi
      ENDO: endolysosomal
      nucleolus: nucleus
      sh_PM_cyto: PM
      sh_PM_exo: PM
      sh_PM_cortex: PM
      sh_NE_lamina: NE
      sh_NE_nuc: NE
      sh_ER_cyto: ER
      sh_ER_lumen: ER
      sh_GOLGI_cyto: golgi
      sh_GOLGI_lumen: golgi
      sh_ENDO_cyto: endolysosomal
      sh_ENDO_lumen: endolysosomal
      sh_OM_cyto: mito
      speckle: nucleus
      sh_NPC: NE
      sh_PM_periph: PM
      sh_ENDO_periph: endolysosomal
      sh_GOLGI_periph: golgi
      mt_lattice: cytosol
      mt_plus: cytosol
      pcm: cytosol
      vim_cage: cytosol
      sh_NPC_fg: NE
    src2comp:                        # inventory localisation key -> comparison compartment (null: pre-pass region decides)
      plasma_membrane: PM
      golgi: golgi
      er: ER
      endolysosomal: endolysosomal
      nuclear_envelope: NE
      mitochondrion: mito
      nucleus: nucleus
      cytosol: cytosol
      cytoskeleton: cytosol
      unassigned: cytosol
      peroxisome: cytosol
      lipid_droplet: cytosol
      secreted: secretory
      prepass: null
    mapping_descriptions:
      PM: "PM (TM) | soluble -> cytosol"
      cytosol: cytosol
      nucleus: "nucleoplasm (no nucleolus compartment)"
      NE: "NE membrane (TM) | perinuclear lumen | soluble -> nucleoplasm"
      ER: "ER membrane (TM) | ER_lumen (signal peptide) | else cytosol"
      mito: "MITO_OM / MITO_IM (TM) | matrix"
      golgi: "GOLGI membrane (TM) | golgi_lumen (signal peptide) | else cytosol"
      endolysosomal: "ENDO membrane (TM) | endo_lumen (signal peptide) | else cytosol"
      secretory: "no compartment: supports ER/golgi/endolysosomal/PM (model: ER_lumen)"
      anymem: "supports any membrane compartment"
    leakage_notes:
      - "HPA consensus locations pool all imaged lines incl. JURKAT and the inventory used them: HPA-JURKAT agreement is partly circular."
      - "OpenCell was never used by the inventory. Clean hold-outs: opencell and hpa_jurkat_holdout_half."
      - "CD3E and CD3D are excluded from every hold-out set (rule R4b, DECISION Pedro 2026-11-10)."
