      mrna: "{data_root}/data/derived/prepass/mrna_cell1.npz"
      mrna_nascent: "{data_root}/data/derived/chromatin/v8/prepass/mrna_nascent_cell1.npz"
      lamina: "{data_root}/data/derived/prepass_v7/lamina_cell1.npz"
    expected_md5:
