# REFERENCE PRESET: the yeast cell through the core stages on the X5 geometry package with the uniform 2 nm membrane
# half thickness (package yeast/analytic_x5_s0_f5f3a5c723b2), i.e. config/cells/yeast.yaml as it was before B6
# (A9 state, 2026-11-17). Its packer clearance is bitwise the A9 one (a uniform MEM_HALF compiles to the plain rule).
#   scripts/build_isolated.sh yeast_x5_core <tag> 24        (cell_id yeast: builds land under <results_root>/yeast/)
# Only the keys that differ from yeast.yaml are listed. The X5 reproduction itself (vendored engine) stays
# config/cells/yeast_x5_port.yaml.
extends: yeast.yaml

seeds:                 # the X5 legacy pack seeds (yeast.yaml: named streams of the master seed since u2)
  legacy:              # yeast X5 streams (cell3d config.seed(k) = k + 1000003 x master; master 0 -> k)
    pack.counts: 3                  # wc3d.distribute(seed=3): the tile request split (pack.requests legacy_x5)
    pack.organisation.field: 11     # organisation.SEED: the random fields of the organisation log weights
    # core packer with pack.preset legacy_x5 (A7 yeast side; master seed 0 only: the expressions ignore the master)
    pack.thinning: 4242             # wc3d.pilot_capacity rng(seed(4242)): choice of the pilot tiles
    pack.thinning.pilot: "k+500000" # wc3d.pilot_capacity: pilot tile k packed with seed(500000 + k)
    pack.tile: "k+1000"             # wc3d.run_phase(seed0=1000): tile k, round 0 (rounds r > 0: + 7919 r in X5; core: stream pack.round)
    pack.squeeze: "k+1007"          # wc3d.squeeze_tile: default_rng(tile seed + 7)

geometry:
  package: "{geom_root}/yeast/analytic_x5_s0_f5f3a5c723b2"
  manifest_sha256: 8ee3c1bc813f0051de8d08955f38e7b6866aef98eb04317315f1c159b3675302

# B5 / B2 (yeast.yaml: localisation preset common; organisation AF3 pool off): the A9 reference keeps the X5 settings
inventory:
  adapters: {secms: null}     # Step 3 (yeast.yaml: SEC-MS toolkit step, tables only): the A9 reference has no SEC-MS step
  params:
    assembly_steps:           # Step 3 (yeast.yaml: preset x5_secms, SEC-fed rules): the A9 reference keeps legacy_x5
      preset: legacy_x5
      overrides: null
      inputs: {uniprot_full: null, string_links: null}
    localisation:
      preset: legacy_x5
      label: yeast.x5
pack:
  preset: legacy_x5           # the A9 reference keeps the X5 packer settings (yeast.yaml pins C3 since B1, 2026-11-18)
  organisation:
    enabled: true              # the X5 reference keeps the layer on (yeast.yaml: off since u2, 2026-11-23)
    pool_scores: "{data_root}/data/derived/wholecell_frozen/yeast_x5/work_seed/organisation/pool_pairs.parquet"   # YC_POOL_SCORES (cached pool table X5 read)
    paralogs: "{yeast_root}/yeast_cell_dev_bundle/pipeline/data/alliance_yeast_paralog_pairs.csv"
    field_cap_regions: []      # X5 split (no field cap: yeast.yaml's freeze fix 2026-11-19 is not part of the reference)

# AF3 pool pairs (restored 2026-11-23, rebuild round v9): this reference keeps the organisation layer with the pool on, so
# it declares the cached table it reads. Best chain-pair PAE (min-min) per protein pair of the Beltrao lab pooled AF3
# co-folding screen of the yeast proteome (https://github.com/jurgjn/pooled-ppi-yeast). The public release v26.1 (Docker
# image jurgjn/pooled-ppi-yeast:v26.1, summary_confidences.parquet) gives the same value for 7,082,835 of the 7,631,089
# pairs it covers; the cache has 10,264,748 pairs (in-house predictions not in v26.1), so the cache is deposited.
frozen_inputs:
  yeast_af3_pool_pairs:
    path: "{data_root}/data/derived/wholecell_frozen/yeast_x5/work_seed/organisation/pool_pairs.parquet"
    md5: 5f8eb5ad6913a261b44804c9bdacd448
    why: "pack.organisation.pool_scores of this reference (cached per-pair PAE min-min of the pooled AF3 screen)"
    kind: structures
    origin: "yeast X5 run cache (organisation.pool_pairs from inputs/summary_models.parquet); public source https://github.com/jurgjn/pooled-ppi-yeast"
    licence: "AlphaFold 3 output terms; see https://github.com/jurgjn/pooled-ppi-yeast (no licence file; usage request in its README)"
