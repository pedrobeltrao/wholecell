# --- plugin steps (wholecell/plugin_steps.py): yeast steps of the normal stage list, each in plugins/yeast/steps.yaml
# with where: plugin. yeast_engine_* make the vendored engine's file layout inside this build (<build>/engine/: links,
# copies and format views of core outputs, never the other way round); the others run vendored yeast code there.
plugin_steps:
  # inventory (composition / localisation / assembly)
  - id: yeast_engine_setup
    stage: inventory
    run: yeast.engine_setup        # engine/{root,work,pdb}: data links, work seed copy (md5), PDB link farm, yeast build stamp
    outputs: [engine/setup.json]
    before: [inventory_v0]
    params:
      engine: *yeast_engine
      data: yeast_pipeline_data    # frozen inputs (read in place); their manifests are re-checked file by file
      pdb: yeast_pdb_cache
      work_seed: yeast_x5_work_seed
      check: [yeast_x5_work_seed, yeast_pipeline_data, yeast_pdb_cache, yeast_afdb_dimers]
  - id: yeast_protein_table
    stage: inventory
    run: yeast.protein_table       # core copies + localisation -> the engine's stage-1 protein table layout
    inputs: [inventory/v0/inventory_v0.tsv, inventory/copies/copies.tsv]
    outputs: [inventory/yeast/protein_table.parquet, inventory/yeast/protein_table_check.json]
    after: [yeast_engine_setup]
    before: [inventory_assembly]
    params: {engine: *yeast_engine, tolerance_rel: 1.0e-9}   # core vs engine values: identical up to float noise, else fail
  # structures (library)
  - id: yeast_library_species
    stage: library
    run: yeast.library_species     # species of the base library (engine ingredients.build_ingredients, as s0_library.py)
    inputs: [inventory/yeast/protein_table.parquet]
    outputs: [inventory/yeast/library_species.tsv]
    before: [library]
    params: {engine: *yeast_engine}
  - id: yeast_engine_lib
    stage: library
    run: yeast.engine_lib          # engine/lib = writable copy of the sealed library/lib (assembly + pre-placed models add to it)
    inputs: [library/library_manifest.tsv]
    outputs: [engine/lib.json]
    after: [yeast_engine_setup]
    before: [inventory_assembly]
    params: {engine: *yeast_engine}
  # pre-placed structures
  - id: yeast_engine_view
    stage: preplaced
    run: yeast.engine_view         # stage-1/2 files the pre-placed context reads: package native geometry, core tile
                                   # measures (yeast names), assembly tables -> engine/work/{yc3d,results/inventory}
    inputs: [geometry/package.json, pack/tiles.parquet, inventory/assembly/ingredients.csv, inventory/assembly/oligo_map.json]
    outputs: [engine/work/yc3d/tile_measure.parquet, engine/work/yc3d/tile_labvol.parquet, engine/work/results/inventory/ingredients.csv]
    after: [yeast_engine_lib]
    before: [preplaced_serial]
    params: {engine: *yeast_engine}
  # validation (yeast checks without a common definition yet; the suite adapter yeast_x5 reads their outputs)
  - id: yeast_engine_pack_view
    stage: validate
    run: yeast.engine_pack_view    # core pack -> engine/work/yc3d (engine-layout tiles_raw, geom, prepass.npz, totals after shell cap,
                                   # tile_counts, pack_summary, thinning.json) for the vendored validation scripts
    inputs: [pack/summary.json, preplaced/serial/preplaced.npz]
    outputs: [engine/work/yc3d/pack_summary.parquet, engine/work/yc3d/expected_totals.parquet]
    params: {engine: *yeast_engine}
  - id: yeast_features
    stage: validate
    run: yeast.engine_script       # per-protein feature table (run_all.sh ran it after stage 1)
    threads: 8
    after: [yeast_engine_view]
    outputs: [engine/work/features/protein_features.parquet]
    params: {engine: *yeast_engine, cwd: pipeline, script: features.py, log: features.log}
  - id: yeast_s4_validate
    stage: validate
    run: yeast.engine_script       # yeast stage 4 (clashes, containment, densities, libpack_meta.npz)
    threads: max
    after: [yeast_engine_pack_view]
    outputs: [engine/work/results/wholecell3d_validation.json, engine/work/yc3d/libpack_meta.npz]
    before: [validate_suite]
    params: {engine: *yeast_engine, cwd: scripts, script: s4_validate.py, log: s4_validate.log}
  - id: yeast_validate_all
    stage: validate
    run: yeast.validate_all        # the yeast validation suite (scripts/validate_all.sh; GPU: contacts, diffusion sweeps)
    threads: max
    gpu: true
    after: [yeast_s4_validate, yeast_features, yeast_s5_encode]
    before: [validate_suite]
    # the yeast engine env (as the X5 port): the validation scripts need cupy (GPU contacts), pyBigWig, playwright, markdown
    params: {engine: *yeast_engine, gpus: 1, python: "{data_root}/conda_envs/yeast_x5/bin/python"}
  # export (YCT1, the legacy viewer encoding: input of some yeast validation scripts and of the X5 comparison; the
  # export stage writes YCT2)
  - id: yeast_s5_encode
    stage: export
    run: yeast.engine_script
    threads: max
    after: [yeast_s4_validate]
    params: {engine: *yeast_engine, cwd: scripts, script: s5_encode.py, log: s5_encode.log,
             python: "{data_root}/conda_envs/yeast_x5/bin/python"}   # yeast engine env: fast_simplification, openmm (not in the core env)
