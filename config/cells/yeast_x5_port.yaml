# REPRODUCTION ONLY: the yeast X5 port as it was built on 2026-11-16 (port build s0 =
# yeast/20261116-aabe7b5-s0-x5repro; seed builds s1 / s2), kept so the X5 reproduction stays runnable. Not used to build
# the yeast cell: config/cells/yeast.yaml builds it through the core stages (unification plan A9, 2026-11-17).
#   scripts/build_isolated.sh yeast_x5_port <tag> 24      (cell_id yeast: builds land under <results_root>/yeast/)
# Structure: pipeline engine `yeast_x5` (plugins/yeast/runner.py: the vendored yeast stage code at e3b7448 +
# PORT_PATCHES.md, DAG = pipeline_engine.steps via workflow/rules/engine.smk), packer `yeast_rsa_v1` selected by
# pack.engine (the only config that still selects a pack engine, plan section 1b), geometry = ONE cellgeom_v1 package
# written per build by toolkits/analytic/yeast.py. Criteria: docs/reference/history/yeast_x5_reproduction_criteria.md
# (+ addendum 2026-11-17). Inputs are read IN PLACE from the yeast tree ({yeast_root}, read-only; nothing is written,
# run or locked there); X5-specific frozen inputs live in {data_root}/data/derived/wholecell_frozen/yeast_x5.
# Standalone copy (no `extends`) of config/cells/yeast.yaml at b88ee5b: the core config can change without moving this
# reproduction. Sections not read by the engine DAG (pack.presets, preplaced.serial, validate) are kept as they were.
schema_version: 1
cell_id: yeast
name: Saccharomyces cerevisiae G1 haploid (yeast build X5 port)
organism: {name: Saccharomyces cerevisiae, taxon: 559292, strain: BY4741}
status: port_x5            # reproduction only (A9)
plugins: [yeast]          # plugins/yeast: pipeline engine yeast_x5, packer yeast_rsa_v1, geometry engine yeast_cell3d_v1, steps.yaml
seeds:
  master: 0
  legacy:              # yeast X5 streams (cell3d config.seed(k) = k + 1000003 x master; master 0 -> k)
    pack.counts: 3                  # wc3d.distribute(seed=3): the tile request split (pack.requests legacy_x5)
    pack.organisation.field: 11     # organisation.SEED: the random fields of the organisation log weights
    # core packer with pack.preset legacy_x5 (A7 yeast side; master seed 0 only: the expressions ignore the master)
    pack.thinning: 4242             # wc3d.pilot_capacity rng(seed(4242)): choice of the pilot tiles
    pack.thinning.pilot: "k+500000" # wc3d.pilot_capacity: pilot tile k packed with seed(500000 + k)
    pack.tile: "k+1000"             # wc3d.run_phase(seed0=1000): tile k, round 0 (rounds r > 0: + 7919 r in X5; core: stream pack.round)
    pack.squeeze: "k+1007"          # wc3d.squeeze_tile: default_rng(tile seed + 7)
geometry:
  toolkit: analytic
  generator: yeast              # toolkits/analytic/yeast.py (runs in the engine environment; builds after stage 1)
  package_root: "{geom_root}/yeast"    # package = <package_root>/analytic_x5_s<seed>_<sha12 of native geometry.json>
  engine: yeast_cell3d_v1       # plugins/yeast/geom_engine.py (the vendored cell3d evaluator)
  seeds: {cellshape: 11, cell3d_stream: 11, mc_check: 0}   # cellshape rng 11 is fixed (not routed through the master seed)
inventory:
  total_protein_pg: 3.5
  total_protein_source: >-
    yeast inventory.py TOTAL_PROTEIN_PG (since build R, 2026-11-12): the one unbudded G1 cell holds less than the 4-6 pg
    culture average (Carroll 2011; Sherman 2002); at 5.0 pg the anchors implied 3.9 pg (core histones) and 3.2 pg
    (nucleoporins); 3.5 pg lies between the two (fixed value, not recomputed: the anchors run as a check)
  adapters: {rna: null, proteome: copies, localisation: null, assembly: null, surface: null}   # only the copies step is ported
  copies:
    method_id: yeast_buildW
    avogadro: 6.02214e23              # the yeast code's constant (wholecell default 6.02214076e23); kept for exact reproduction
    annotation: {reader: uniprot_ordered_locus, path: inv_yeast_uniprot, carry: [orf, gene_name]}
    universe: {order: annotation}     # every UniProt entry (one per ORF), in file order; no detection required
    value_column: ppm
    sources:
      - id: inv_yeast_paxdb
        type: ppm
        unit: "PaxDb integrated ppm (S. cerevisiae whole organism, 4932)"
        reader: paxdb
        path: inv_yeast_paxdb
        strip_prefix: "4932."
        map_on: orf                   # ids summed per ORF
        column: ppm_paxdb
        label: paxdb
        aggregate: "integrated (PaxDb)"
    combine: {mode: priority}
    imputation: {method: none, missing_label: not_in_paxdb}   # no RNA imputation: proteins without PaxDb ppm get 0
    absent:
      - {id: not_in_this_cell, file: "{repo}/plugins/yeast/data/inventory_copies.yaml", categories_key: not_in_this_cell,
         match_on: gene_name, label: not_in_this_cell}
    per_protein_scaling:
      - rule_id: g1_size_scaling      # round U2 (2026-11-13): PaxDb = culture-average cell (42 um3) -> the 34 um3 G1 cell
        kind: size_slope              # ppm x (34/42)^slope, slope of log concentration vs log volume per protein
        match_on: orf
        ratio: {numerator: 34.0, denominator: 42.0}   # CELL_VOL / POP_MEAN_VOL of yeast inventory.py
        evidence: "Lanz et al. 2024 Nat Struct Mol Biol 31:1859, Table S3 (G1 arrest, glucose)"
        table: {path: inv_yeast_lanz2024_s3, sheet: G1_arrest_time_Glucose, id_column: "Systematic name",
                slope_column: Mean_protein_slope, replicate_prefix: Protein_slope_Exp, min_replicates: 2, max_se: 0.15,
                clip: [-1.2, 0.8], default: median}
    total_protein: {mode: fixed}      # 3.5 pg (inventory.total_protein_pg)
    adjustments:
      - rule_id: ribosomes_cryoet_density   # round U1 (2026-11-13): ribosomes from the counted density, not from PaxDb
        kind: family_target
        structure: cytosolic 80S ribosome
        match_on: gene_name
        members: {regex: "^(RP[LS]\\d+|RPP[012])[AB]?$", genes: [ASC1]}
        family_sub: ["[AB]$", ""]
        target:
          density_per_um3: 14250.0      # mean of the cryo-ET counts 14,000 (Delarue 2018) and 14,517 (Goetz 2025 preprint)
          volume_um3: 18.436635385716613   # cytosol of yeast inventory.geometry() (34 um3 cell, 0.11 um wall, fractions) + NE lumen correction of build()
          source: "yeast inventory.py RIBO_PER_UM3 x vol[cytosol] (build W: 262,722)"
    round_copies: false               # the yeast method keeps fractional copies
    anchor_check: {use: final}
    anchors:                          # the yeast validation/anchors.py set (check, not used for the scale)
      - id: nucleoporins
        structure: nuclear pore complex
        statistic: median
        stoich_map: {file: "{repo}/plugins/yeast/data/inventory_copies.yaml", key: npc_copies}
        filter_regex: "^(NUP\\d+|NSP1|NIC96|NDC1|POM\\d+|ASM4|GLE1)$"
        counts:
          - {label: model_pores_W, value: 93, primary: true, source: "inventory.N_NPC = 10.8 per um2 x nuclear surface (build W)"}
          - {label: winey1997_mean, value: 117, source: "Winey 1997, mean over the cell cycle (65-182)"}
      - id: core_histones
        structure: nucleosome
        statistic: median
        families:
          H3: {stoich: 2, genes: ["HHT1; HHT2"]}
          H4: {stoich: 2, genes: ["HHF1; HHF2"]}
          H2A: {stoich: 2, genes: [HTA1, HTA2]}
          H2B: {stoich: 2, genes: [HTB1, HTB2]}
        counts:
          - {label: build_W_nucleosomes, value: 69714, primary: true, source: "build W ingredients.csv nucleosome copies (measured dyads on the arms + rDNA nucleosomes)"}
          - {label: genome_over_nrl, value: 73151.51515151515, source: "12.07 Mb / 165 bp"}
      - id: ribosomal_proteins
        structure: cytosolic 80S ribosome
        statistic: median
        match_on: gene_name
        members: {regex: "^(RP[LS]\\d+|RPP[012])[AB]?$", genes: [ASC1]}
        family_sub: ["[AB]$", ""]
        counts:
          - {label: warner1999, value: 200000, primary: true, source: "~2 x 10^5 per cell (Warner 1999)"}
          - {label: vonderhaar2008, value: 187000, source: "187,000 +- 56,000 (von der Haar 2008)"}
          - {label: cryoet_density_target, value: 262722.0542464617, source: "14,250 per um3 x 18.44 um3 cytosol (the adjustment target)"}
    future_sources:
      - {id: yeast_secms_abundance, type: secms_abundance, role: cross_check, enabled: false, notes: "yeast SEC-MS (toolkits/secms, species yeast) summed intensity; cross-check"}
      - {id: yeast_surface_proteomics, type: surface_proteomics, role: pm_copies, enabled: false, notes: "PM copy numbers when available"}
  params:
    # Core assembly step list, preset legacy_x5 (unification A4; wholecell/inventory/assembly). NOT wired yet
    # (adapters.assembly stays null; the build runs the engine's s1 until A9): scripts/assembly_x5_check.py runs it on the
    # s0 stage-1 inputs and requires the s0 assembly tables. inputs: frozen input name or "<frozen name>/<path inside>";
    # protein_table = the stage-1 protein table (engine inventory.build(); A9: the core composition + localisation
    # output); engine = the vendored engine layout {root, work, lib, pdb, code, inputs} of the plugin steps (set by
    # the runner / the check script).
    assembly_steps:
      preset: legacy_x5
      inputs:
        complex_portal: yeast_pipeline_data/complexportal_559292.tsv
        intact_pairs: yeast_pipeline_data/intact_pairs.tsv
        paralog_pairs: yeast_pipeline_data/alliance_yeast_paralog_pairs.csv
        proteome_fasta: yeast_pipeline_data/uniprot/UP000002311.fasta
        rcsb_cache: yeast_x5_work_seed/rcsb_cache.json
        pdb_assemblies: yeast_pdb_cache
        afdb_heterodimers: yeast_afdb_dimers/heterodimers/candidates.csv
        afdb_homodimers: yeast_afdb_dimers/homodimers/candidates.csv
      data:
        curated_machines: plugins/yeast/data/assembly/curated_machines.tsv
        curated_machine_subunits: plugins/yeast/data/assembly/curated_machine_subunits.tsv
        legacy_oligomers: plugins/yeast/data/assembly/legacy_oligomers.tsv
        copies_exclude_subunits: plugins/yeast/data/assembly/copies_exclude_subunits.tsv
        shared_subunits: plugins/yeast/data/assembly/shared_subunits.tsv
        structure_overrides: plugins/yeast/data/assembly/structure_overrides.tsv
        histone_classes: plugins/yeast/data/assembly/histone_classes.tsv
        monomeric_families: plugins/yeast/data/assembly/monomeric_families.tsv
        homo_oligomer_audit: plugins/yeast/data/assembly/homo_oligomer_audit.tsv
pipeline_engine:
  # The yeast stages run as an external engine (registry kind pipeline_engine, plugins/yeast/runner.py); the workflow
  # takes its DAG from `steps` (workflow/rules/engine.smk). stage: engine = runner step; pack / export / inventory =
  # the core stage of that name (pack dispatches to pack.engine).
  name: yeast_x5
  code: "{repo}/plugins/yeast/engine"            # vendored yeast code (git archive e3b7448 + PORT_PATCHES.md)
  python_env: "{data_root}/conda_envs/yeast_x5"   # byte copy of the yeast bundle .venv (CPython 3.11, numba 0.61.2)
  data_dir: "{yeast_root}/yeast_cell_dev_bundle/pipeline/data"   # read in place (linked as engine pipeline/data)
  pdb_dir: "{yeast_root}/yeast_cell_dev_bundle/work/pdb"         # read in place through a link farm (new downloads land in the build)
  inputs_dir: "{yeast_root}/inputs"                               # AFDB tar, AFDB dimers, AF3 pool summary (read in place)
  frozen_dir: "{data_root}/data/derived/wholecell_frozen/yeast_x5"   # lib_start/ (342 entries), work_seed/, manifests
  seed: 0                     # YC_SEED (master seed; 0 = the reference build's streams)
  nproc: 24                   # YC_NPROC (tile seeds are independent of the worker count); launch may override (WHOLECELL_ENGINE_NPROC)
  gpus: 1                     # YC_NGPU / CUDA_VISIBLE_DEVICES=0 for the GPU validation steps (contacts, sweeps)
  first_stage: 0              # as X5 (stage 0 rebuilds the base library)
  reference: "{yeast_root}/runs/X5_seed0"         # READ-ONLY reference for compare_x5
  steps:
    - {id: setup}
    - {id: s0_library, after: [setup]}
    - {id: s1_inventory, after: [s0_library]}           # + features.py (as run_all.sh)
    - {id: core_copies, after: [setup]}                  # shared core step wholecell.inventory.copies (criterion I3)
    - {id: geometry_package, after: [s1_inventory]}      # toolkits/analytic/yeast.py -> cellgeom_v1 package
    - {id: s2_geometry, after: [geometry_package]}       # tiling from the package (PORT_PATCHES P1)
    - {id: pack, stage: pack, step: pack, after: [s2_geometry]}   # pack.engine = yeast_rsa_v1 (stage 3)
    - {id: s4_validate, after: [pack]}
    - {id: s5_encode, after: [s4_validate]}
    - {id: validate_all, after: [s5_encode]}             # yeast validation suite (GPU: contacts, sweeps)
    - {id: pack_view, after: [s4_validate]}              # yeast tiles -> core pack layout (pack/), for the core exporter
    - {id: export_regions, stage: export, step: regions, after: [pack_view]}
    - {id: export_tiles_v2, stage: export, step: tiles_v2, after: [pack_view]}
    - {id: export_cell_entry, stage: export, step: cell_entry, after: [export_tiles_v2]}
    - {id: compare_x5, after: [validate_all, export_tiles_v2, export_regions, core_copies]}
pack:
  preset: none                # pinned: no preset merged (B1: switches.COMMON_DEFAULTS apply only to cells without a pin)
  engine: yeast_rsa_v1        # registered by plugins/yeast (option a: the yeast seeded packer as an alternative engine)
  tile_nm: 200.0              # yeast tiles3d.TILE (the core v7 packer uses 500 nm); grid from the geometry, not TGRID
  # Tiling (core step `pack --step tiles`, wholecell/pack/tiling.py; A2): the yeast tiles3d settings. The yeast
  # build still tiles inside the engine (stage s2) until A9; the core step reproduces it (G4/G5 identical, A2 check).
  meas_vox_nm: 4.0            # tiles3d.VOX: voxel size of the region volume measures
  meas_h_nm: 8.0              # tiles3d.MESH_H: marching-cubes lattice of the membrane areas and the tile meshes
  halo_nm: 36.7               # X5 s3: largest bounding radius of the packed types (NPC excluded) + 1 nm; the yeast packer
                              # derives it from the library, the core packer (preset legacy_x5) reads this value
  tiling:
    select: enclosing_sphere  # tiles3d.tile_list: tiles meeting the enclosing sphere minus tiles surely outside the cell
    sample_reach_nm: 88.0     # tile_list: 27 samples 100 nm apart reach every tile point within 86.6 nm
    box_margin_nm: 80.0       # cell3d.Cell.select margin used by tiles3d.tile_geometry (prims near the tile)
    pore_reach_nm: 119.0      # Cell.select: pores within PORE_R 45 + PERI_W 34 + 40 nm of the grown tile
    labvol: true              # tile_labvol.parquet (yeast stage 2 output)
    meshes: true              # tile_geom/<tile>.npz: the packing meshes (yeast yc3d/geom)
    mesh_membranes: [PM, ER, NE, VAC, MITO_OM, MITO_IM, GOLGI, PEROX, LD]   # every membrane but CELL_OUTER
  # Tile requests (core step `pack --step counts`, wholecell/pack/requests.py; A2): the yeast wc3d.distribute split.
  # Inputs the core does not make yet are declared (paths relative to the build): the per-type totals after pre-pass
  # consumption and shell cap (A5/A6), the library order and packing trees (A3), the pilot thinning factors and the
  # organisation loadings (A7). The yeast build still makes its requests inside the engine (stage s3).
  requests:
    method: legacy_x5
    totals: engine/work/yc3d/expected_totals.parquet
    lib_order: engine/work/yc3d/lib_ids.npy
    shape_volumes: engine/work/yc3d/pack_trees_15.npz     # wc3d.PACK_PER = 15 residues per sphere
    thinning: engine/work/yc3d/thinning.json
    # organisation.BETA, FIELD_L, FIELD_NF. network.npz stores E as float32 (the packer used float64): with it 2 of
    # 3.37 M (tile, type, region) cells differ by one copy; float64 loadings (A7 phase 2) reproduce X5 exactly (A2 check)
    organisation: {loadings: engine/work/organisation/network.npz, beta: 0.8, field_l_nm: 500.0, n_features: 128}
  # Regions = the yeast tiles3d tables (REGION_NAMES, REG_MASK, BANDS, WALL_DEPTH @ e3b7448), in the yeast id order:
  # the position in this list is the region id (job_region) of the yeast tiles, 0-26. Not grouped by kind: the core
  # packer maps it to its kernel order (Regions.k_of / c_of; A7). Bands are shells with side 0 (|SDF| < d1, cytosol
  # voxels only) measured as volumes, packed like volume regions from their voxels (as the yeast packer did).
  # Labels / membranes: names of the yeast cellgeom_v1 package.
  regions:
    - {name: cytosol, kind: volume, labels: [cytosol]}                          # 0
    - {name: nucleoplasm, kind: volume, labels: [nucleoplasm]}                  # 1
    - {name: nucleolus, kind: volume, labels: [nucleolus]}                      # 2
    - {name: ER_lumen, kind: volume, labels: [er_lumen, perinuclear_space]}     # 3: cortical ER lumen + NE lumen (ER)
    - {name: vacuole, kind: volume, labels: [vacuole_lumen]}                    # 4
    - {name: mito_matrix, kind: volume, labels: [mito_matrix]}                  # 5
    - {name: mito_IMS, kind: volume, labels: [mito_ims]}                        # 6
    - {name: golgi_endosome, kind: volume, labels: [golgi_endosome_lumen]}      # 7
    - {name: peroxisome, kind: volume, labels: [peroxisome_matrix]}             # 8
    - {name: cell_wall, kind: volume, labels: [wall_mannan, wall_glucan], sdf_lt: {membrane: CELL_OUTER, nm: 60.0}}   # 9: tiles3d.WALL_DEPTH, the outer 60 nm (mannoprotein layer + outer glucan)
    - {name: PM_peripheral, kind: shell, membrane: PM, labels: [cytosol], side: 0, d0: 0.0, d1: 22.0, measure: volume}    # 10: tiles3d.BANDS
    - {name: NE_peripheral, kind: shell, membrane: NE, labels: [cytosol], side: 0, d0: 0.0, d1: 20.0, measure: volume}    # 11
    - {name: ER_peripheral, kind: shell, membrane: ER, labels: [cytosol], side: 0, d0: 0.0, d1: 25.0, measure: volume}    # 12
    - {name: LD_peripheral, kind: shell, membrane: LD, labels: [cytosol], side: 0, d0: 0.0, d1: 12.0, measure: volume}    # 13
    - {name: mem_PM, kind: membrane, membrane: PM}                              # 14 (tiles3d.MEM_REGION0 + membrane code)
    - {name: mem_ER, kind: membrane, membrane: ER}                              # 15
    - {name: mem_NE, kind: membrane, membrane: NE}                              # 16
    - {name: mem_VAC, kind: membrane, membrane: VAC}                            # 17
    - {name: mem_MITO_OM, kind: membrane, membrane: MITO_OM}                    # 18
    - {name: mem_MITO_IM, kind: membrane, membrane: MITO_IM}                    # 19
    - {name: mem_GOLGI, kind: membrane, membrane: GOLGI}                        # 20
    - {name: mem_PEROX, kind: membrane, membrane: PEROX}                        # 21
    - {name: chromatin_nucleosome, kind: preplaced}                             # 22: pre-placed nucleosomes (webenc.R_NUCLEOSOME)
    - {name: NE_pore_NPC, kind: preplaced}                                      # 23: pre-placed nuclear pores (webenc.R_NPC)
    - {name: VAC_peripheral, kind: shell, membrane: VAC, labels: [cytosol], side: 0, d0: 0.0, d1: 20.0, measure: volume}  # 24: cytosolic faces added after the viewer codes
    - {name: GOLGI_peripheral, kind: shell, membrane: GOLGI, labels: [cytosol], side: 0, d0: 0.0, d1: 20.0, measure: volume}  # 25
    - {name: PEROX_peripheral, kind: shell, membrane: PEROX, labels: [cytosol], side: 0, d0: 0.0, d1: 20.0, measure: volume}  # 26
  # Core packer with the yeast X5 packer settings (A7 yeast side): `pack.preset: legacy_x5` or the CLI argument
  # preset=legacy_x5 merges this block into pack: (switches.effective). NOT selected here: the yeast build still packs in
  # the engine (pack.engine yeast_rsa_v1) until A9. Origins: plugins/yeast/engine/pipeline/{wc3d,tiles3d,squeeze}.py @
  # e3b7448 and the s3 log of the port build s0. Inputs the core does not make yet are read from the engine work tree
  # of the build (paths relative to the build dir): pre-pass, totals, library order, packing trees (A3, A5/A6, A9).
  presets:
    legacy_x5:
      engine: core                 # the core packer (wholecell/pack/stage.py) instead of pack.engine yeast_rsa_v1
      vox_nm: 4.0                  # tiles3d.VOX: seed voxels of the volume regions (and bands)
      mesh_h_nm: 8.0               # tiles3d.MESH_H: marching-cubes lattice of the membrane meshes (membrane proteins)
      max_tries: 2000              # wc3d.PACK_TRIES (IMPROVEMENTS N1): tries per copy, every region
      give_up: 1200                # wc3d.PACK_GIVE_UP: failures in a row before a job stops, every region
      lumen_align: true            # wc3d.FLAT: half of the tries align the flattest axis with the membrane normal ...
      thin_lumens:                 # ... of these regions (wc3d.FLAT_MEM: thin lumens and the cytosolic bands)
        ER_lumen: ER
        mito_matrix: MITO_IM
        mito_IMS: MITO_OM
        golgi_endosome: GOLGI
        PM_peripheral: PM
        NE_peripheral: NE
        ER_peripheral: ER
        LD_peripheral: LD
        VAC_peripheral: VAC
        GOLGI_peripheral: GOLGI
        PEROX_peripheral: PEROX
      volume_shell_tol_nm: 4.0     # wc3d.SHELL_TOL: a partner proposal / squeezed copy of a band may sit this far beyond its width
      rounds: {n: 6, split: equal_volume, alternate: true}   # wc3d.N_ROUNDS, round_edges; s3_pack reverses the pass order in odd rounds
      thinning:                    # wc3d.THIN / pilot_capacity / thin
        enabled: true              # wc3d.THIN
        pilot_tiles: 16            # wc3d.THIN_TILES
        min_rel: 1.1               # wc3d.THIN_MIN_REL (x the cytosol's requested sphere volume fraction)
        safety: 0.97               # wc3d.THIN_SAFETY
        keep_above: 0.98           # pilot_capacity: regions that held >= 98 % are left alone
        reference_region: cytosol  # pilot_capacity: phi_cyt
        pilot_squeeze: true        # the pilot ran pack_one(last=True): squeeze included
        resplit: true              # s3_pack: counts = distribute(thin(exp3)) (seed 3 again), not binomial thinning
      shell_cap: true              # wc3d.SHELL_CAP (s3 applied it before saving expected_totals: a no-op on those totals)
      budgets:                     # X5 reg_tries = 0 everywhere (global 2000 / 1200); listed so the core thin-lumen factors do not apply
        per_region:
          ER_lumen: {max_tries: 2000, give_up: 1200}
          mito_matrix: {max_tries: 2000, give_up: 1200}
          mito_IMS: {max_tries: 2000, give_up: 1200}
          golgi_endosome: {max_tries: 2000, give_up: 1200}
          PM_peripheral: {max_tries: 2000, give_up: 1200}
          NE_peripheral: {max_tries: 2000, give_up: 1200}
          ER_peripheral: {max_tries: 2000, give_up: 1200}
          LD_peripheral: {max_tries: 2000, give_up: 1200}
          VAC_peripheral: {max_tries: 2000, give_up: 1200}
          GOLGI_peripheral: {max_tries: 2000, give_up: 1200}
          PEROX_peripheral: {max_tries: 2000, give_up: 1200}
      squeeze: {scope: all, rounds: 4, iterations: 60, insert_frac: 0.15}   # wc3d.SQUEEZE (every tile, last round); squeeze.N_ROUNDS, N_ITER, ROUND_FRAC
      exclusion:                   # wc3d.exclusion_zones / EXCL_TYPES: no ribosome centre in the endocytic zones
        - name: ribosomes_endocytic_sites
          lib_prefixes: [ribosome_80S, preribo_40S, preribo_60S_cytoplasm]   # wc3d.EXCL_TYPES (startswith)
          around: {provider: yeast.endocytic_sites, params: {r_nm: 90.5, beyond_nm: 100.0, step_nm: 30.0}}   # EXCL_R, EXCL_BEYOND, EXCL_STEP
      organisation:                # yeast pipeline/organisation.py (X5 settings, AF3 pool ON: reproduction only, not published)
        enabled: true
        string: {taxon: 4932, version: "12.0", links: "{yeast_root}/yeast_cell_dev_bundle/pipeline/data/string/4932.protein.links.v12.0.txt.gz",
                 min_score: 400, ids: {table: inv_yeast_uniprot, columns: ["Gene Names (ordered locus)"]}}   # organisation.STRING_MIN 400
        genes: {table: inv_yeast_uniprot, columns: ["Gene Names (primary)", "Gene Names (ordered locus)"]}
        subunits: {table: engine/work/results/inventory/ingredients.csv, lib_map: engine/work/yc3d/expected_totals.parquet,
                   ids: engine/work/yc3d/lib_ids.npy}   # s1 ingredients; types = the packed library order
        pool_scores: "{data_root}/data/derived/wholecell_frozen/yeast_x5/work_seed/organisation/pool_pairs.parquet"   # YC_POOL_SCORES (cached pool table X5 read)
        paralogs: "{yeast_root}/yeast_cell_dev_bundle/pipeline/data/alliance_yeast_paralog_pairs.csv"
      shapes: {source: pack_shapes, file: engine/work/yc3d/pack_trees_15.npz, library: engine/lib}   # wc3d.PACK_PER = 15; trees made from engine/lib (size:mtime signatures)
      preplaced_index:             # pre-placed instances of the engine s3 (A9: preplaced/serial/preplaced.npz of the core stage)
        npz: engine/work/yc3d/prepass.npz
        lib_ids: engine/work/yc3d/lib_ids.npy
        groups: [[npc, li_npc], [nuc, li_nuc], [poly, li_ribo], [act, li_actin], [tpm, li_tpm], [mt, null], [pat, null],
                 [atp, li_atp], [eis, null], [cvt, null], [pol2, li_pol2], [nvj, li_nvj], [rvs, li_rvs], [coat, null],
                 [mcc, null], [kt, null], [mcm, li_mcm], [orc, li_orc], [tf, null], [rnp, null], [kto, null], [spb, null],
                 [lm, null], [kap, null], [rpol, li_rpol], [r90, li_r90], [rnuc, li_nuc]]   # wc3d.PRE_GROUPS (order)
        beads: [poly_link, mrna_pts, fg_pts, rdna_pts, prerrna_pts, mtdna_pts, pol2dna_pts, pol2rna_pts]   # wc3d.setup_shared RNA / DNA beads
        bead_radius_nm: 0.5        # wc3d.pack_one: bead obstacles of radius 0.5 nm
      requests: {thinning: null, organisation: null}   # thinning from the pilot (pack step); loadings from pack/organisation/network.npz
# --- validation: the yeast checks still run in the engine (validate_all); the common suite reads them (A8 phase 1) ---
validate:
  # Core steps on the yeast tiles (A8 phase 2): run by the suite (core_steps) into its own output folder; inputs the core
  # cannot find in the port build (library = engine/lib, geometry package from geometry/package.json) come from the
  # adapter (core_inputs). The packed-library mass is the library bead mass (pack/libs.json has no mass_da).
  placement: {n_tiles: 300, clash_nm: 0.5, grid_nm: 6.0, membrane_tol_nm: 0.5, shell_tol_nm: 0.5, pore_axial_nm: 150.0, min_req: 100, mrna: true}
  crowding:
    regions: [cytosol, nucleoplasm, mito_matrix, ER_lumen]   # as Jurkat (cytosol, nucleoplasm, matrix, ER_lumen)
    n_boxes: 4
    box: 150.0
    vox: 0.5
    margin: 25.0
    probes: [0.0, 1.0, 1.6, 2.3, 3.0]
    legacy_seeds: false              # named seed streams (validate.crowding.*)
  densities:
    default_region: cytosol
    shell_to_volume:                 # yeast bands are cytosol voxels next to a membrane (s4_validate reg2comp)
      PM_peripheral: cytosol
      NE_peripheral: cytosol
      ER_peripheral: cytosol
      LD_peripheral: cytosol
      VAC_peripheral: cytosol
      GOLGI_peripheral: cytosol
      PEROX_peripheral: cytosol
    preplaced_group_volume:          # pre-pass group (pack/preplaced_groups.json) -> volume region, as s4_validate books it;
                                     # not_counted = not in any s4 compartment (NPCs, ATP synthase dimers, eisosomes)
      chromatin_nucleosome: nucleoplasm
      "chromatin_nucleosome[1]": nucleolus      # 2nd entry = rDNA nucleosomes (s4: rnuc_pos -> nucleolus)
      rdna_transcription: nucleolus
      transcribing_pol2: nucleoplasm
      licensed_origins: nucleoplasm
      kinetochores: nucleoplasm
      chromatin_bound_proteins: nucleoplasm
      npc_transport_receptors: {cytosol: 0.5, nucleoplasm: 0.5}
      spindle_pole_body: cytosol
      polysome_ribosomes: cytosol
      actin_cables: cytosol
      endocytic_actin_patches: cytosol
      cvt_complex: cytosol
      mrnp_ends: cytosol
      endocytic_coat_bar: cytosol
      nucleus_vacuole_junction: cytosol
      microtubules: cytosol          # s4 splits by mt_reg (nuclear MTs to the nucleoplasm): not in the pre-pass index
      "microtubules[2]": nucleoplasm # gTuRC_nuc
      NE_pore_NPC: not_counted
      atp_synthase_dimers: not_counted
      eisosomes: not_counted
    nucleus_group: [nucleoplasm, nucleolus]
    ratio_denominator: cytosol
  suite:                             # common validation suite (plan s4; docs/stages/validation.md)
    adapter: yeast_x5                # plugins/yeast/validate_adapter.py: reads engine/work validation outputs
    core_steps: [placement, crowding, densities]   # A8 phase 2: core steps on the yeast tiles (into the suite's folder)
    notes:                           # explanations attached to suite rows (A8 phase 2 findings)
      C8/a.containment_rate_per_1e6: >-
        all from shells (peripheral bands); the yeast packer draws shell centres in 4 nm region voxels (voxel centre
        |SDF| < d1) with +-2 nm jitter, so centres reach d1 + 3.5 nm (diagnosed: every failing centre is in the cytosol,
        |SDF| - d1 = 0.6-4.0 nm, 95 % <= 3.5 nm); the core test allows d1 + 0.5 nm. Beads outside their region: C8 (b)
      C8/a.containment_rate_per_1e6.shell: "see a.containment_rate_per_1e6: voxel sampling of the yeast packer, not beads outside"
      C7/a.prepass_prepass_per_1e6: >-
        built pre-pass structures (polysome chains, actin filaments and cables, nucleosome arrays) touch by construction;
        report only
    seam: {region: cytosol, min_frac: 0.95, n_tiles: 300, seed: 0}
    reference:                       # no-regression reference build (plan s5) and its suite output (A8: run into _dev_unify)
      build: "{results_root}/yeast/20261116-aabe7b5-s0-x5repro"
      suite: "{results_root}/yeast/_dev_unify/a8p2/20261116-aabe7b5-s0-x5repro/suite.json"

preplaced:                           # pre-placed structures ("prepass" before A0c)
  # Serial pre-placed builders (wholecell/preplaced/serial.py, `preplaced --step serial`; unification A6): the pre-pass of
  # the vendored stage 3 (scripts/s3_pack.py) as registered modules, in its order (the order is part of the result:
  # each builder avoids the ones before it and deducts its copies from the pools the next ones read). `seed` values
  # are the yeast stream numbers (engine config.seed(k) = k + 1000003 x master seed). The yeast build still runs the
  # pre-pass inside the engine's s3_pack until the wiring step (A9); this section reproduces its prepass.npz exactly
  # (scripts/preplaced_a6_check.py). core.* = mechanism shared with other cells (numerics still the engine's until B4).
  numba_threads: 8
  serial:
    context: yeast.s3
    context_params:
      engine: {root: "build:engine/root", work: "build:engine/work", lib: "build:engine/lib", pdb: "build:engine/pdb",
               code: "{repo}/plugins/yeast/engine", seed: 0}
    out: preplaced/serial
    builders:
      - {name: npc, builder: core.npc_pores, params: {lib_id: NPC, seed: 5}}
      - {name: microtubules, builder: core.microtubules_mtoc, params: {seed: 31}}
      - {name: kinetochores, builder: yeast.kinetochores, params: {seed: 61, outer_seed: 67}}
      - {name: spb, builder: yeast.spb, params: {seed: 71, ring_spc110_per_nuclear_ring: 14}}
      - {name: chromatin, builder: yeast.rabl_chromatin, params: {seed: 5}}
      - {name: spindle_pools, builder: yeast.spindle_pools}
      - {name: pore_receptors, builder: core.npc_receptors, params: {seed: 73}}
      - {name: fg_mesh, builder: core.fg_mesh, params: {seed: 37}}
      - {name: rdna, builder: yeast.rdna_transcription, params: {seed: 41}}
      - {name: rdna_chromatin, builder: yeast.rdna_chromatin, params: {seed: 9, n_chains: 8}}
      - {name: pol2, builder: yeast.pol2, params: {seed: 91}}
      - {name: origins, builder: yeast.origins, params: {seed: 77}}
      - {name: chromatin_sites, builder: yeast.chromatin_sites, params: {seed: 53, loci: true, loci_seed: 59}}
      - name: microtubule_pools
        builder: core.microtubule_pools
        params: {tusc_per_ring: 6, tusc_subunits: {TUB4: 2}, ring_attachment: {ings: [SPC110, CMD1_SPC110_het], per_nuclear_ring: 14}}
      - {name: eisosomes, builder: yeast.eisosomes, params: {seed: 53}}
      - {name: mcc, builder: yeast.mcc, params: {seed: 73}}
      - {name: actin_cables, builder: yeast.actin_cables, params: {seed: 23}}
      - {name: endocytic_coat, builder: yeast.endocytic_coat, params: {seed: 69}}
      - {name: amphiphysin, builder: yeast.amphiphysin, params: {seed: 67}}
      - {name: actin_patches, builder: yeast.actin_patches, params: {seed: 41}}
      - {name: atp_synthase, builder: core.atp_synthase_dimers, params: {seed: 7, region: mem_MITO_IM}}
      - {name: mtdna, builder: core.mtdna_nucleoids, params: {seed: 81}}
      - {name: cvt, builder: yeast.cvt, params: {seed: 61}}
      - {name: nvj, builder: yeast.nvj, params: {seed: 63}}
      - {name: polysomes, builder: core.polysomes, params: {seed: 17, transcripts_seed: 23, tether_seed: 29, n_mrna: 30000}}
      - {name: rac, builder: yeast.rac, params: {seed: 71}}
      - {name: mrna, builder: core.mrna_threads, params: {seed: 29}}
      - {name: mrnp, builder: core.mrnp_ends, params: {seed: 37, pab: PAB1, cap: CDC33}}
export:
