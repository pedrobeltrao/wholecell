  steps: [regions, tiles_v2, cell_entry]
  tiles: {enabled: true, tile_nm: 200.0, block_tiles: 5, q_org_nm: 80.0, q_range_nm: 360.0, shard_max_mb: 45, origin_nm: [0.0, 0.0, 0.0]}
