    md5: 8c36c48d7a980a186e528e4c350a1901
    why: "synthetic heterodimer candidate pairs"
    kind: synthetic
    url: ""
    version: "tests/data/testcell/make_testcell_secms.py"
    licence: "repository"
    redistributable: yes
  inv_testcell_secms_standards:
    path: "{repo}/tests/data/testcell/secms_standards.tsv"
    md5: 4109ed6703aac682cedbcf9247fa87e2
    why: "synthetic column standards on the column law"
    kind: synthetic
    url: ""
    version: "tests/data/testcell/make_testcell_secms.py"
    licence: "repository"
    redistributable: yes
  lib_testcell: {path: "{repo}/tests/data/testcell/lib", manifest: "{repo}/tests/data/testcell/library_manifest.tsv.gz", md5: aaf9bb189a5f86405b72b5ea16415072, origin: "45 npz copied from the Jurkat v7 library ({data_root}/jurkat/yc/pipeline/lib)", why: "testcell structure library (small, in the repo)"}
